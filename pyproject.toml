[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ontseq-platform"
version = "0.4.0"
description = "A safety-first foundation for automated single-sample Oxford Nanopore karyotyping workflows."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Xhuljano Shehu" }]
dependencies = [
  "openpyxl>=3.1,<4",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pre-commit>=3.8",
  "pytest>=8",
  "ruff>=0.6",
  "types-openpyxl>=3.1",
  "types-PyYAML>=6",
]
workflow = [
  "snakemake>=9,<10",
]

[project.scripts]
ontseq = "ontseq_platform.entrypoint:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ontseq_platform.service" = ["*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
