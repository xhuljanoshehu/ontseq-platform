# Snakemake is a caller of `ontseq run`, not a second execution path (ADR-013). The run
# envelope layout below is produced by the runner; do not point these at flat files.
manifest: examples/manifests/aligned_bam.example.yaml
reference_lock: examples/references/synthetic.reference-lock.yaml
qc_policy: configs/qc/defaults.yaml
sniffles_policy: configs/sv/sniffles2.conservative.technical.yaml
# Required only when the manifest declares pod5 or unaligned_bam input.
# reference_fasta: /approved/references/GRCh38.fa
output_dir: results/runs
run_id: SNAKEMAKE_RUN_001
threads: 4
git_commit: UNKNOWN
tools:
  samtools: samtools
  cramino: cramino
  sniffles: sniffles
  minimap2: minimap2
outputs:
  run_report: results/runs/SNAKEMAKE_RUN_001/SYNTHETIC_001/provenance/run.json
  release: results/runs/SNAKEMAKE_RUN_001/SYNTHETIC_001/release/release.json
  checksums: results/runs/SNAKEMAKE_RUN_001/SYNTHETIC_001/release/checksums.sha256
