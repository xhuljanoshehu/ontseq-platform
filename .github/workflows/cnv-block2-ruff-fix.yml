name: CNV block 2 ruff fix

on:
  push:
    branches:
      - feat/cnv-validation-program
    paths:
      - ".github/workflows/cnv-block2-ruff-fix.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.6"
      - name: Apply Ruff-safe fixes and formatting
        run: |
          ruff check --fix \
            src/ontseq_platform/cnv_validation_evidence.py \
            tests/test_cnv_validation_evidence.py
          ruff format \
            src/ontseq_platform/cnv_validation_evidence.py \
            tests/test_cnv_validation_evidence.py
          ruff check \
            src/ontseq_platform/cnv_validation_evidence.py \
            tests/test_cnv_validation_evidence.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ontseq_platform/cnv_validation_evidence.py \
            tests/test_cnv_validation_evidence.py
          if git diff --cached --quiet; then
            echo "Block 2 evidence files already Ruff-clean."
          else
            git commit -m "style(cnv): format block 2 evidence files"
            git push origin HEAD:feat/cnv-validation-program
          fi
