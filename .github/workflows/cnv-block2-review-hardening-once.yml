name: CNV block 2 review hardening once

on:
  push:
    branches:
      - feat/cnv-validation-program
    paths:
      - ".github/workflows/cnv-block2-review-hardening-once.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/cnv-validation-program
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Apply narrowly scoped manifest hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/ontseq_platform/cnv_validation_evidence.py")
          text = path.read_text(encoding="utf-8")
          old = '''            if missing_sources:\n                raise ValueError(\n                    "Normalized event references missing full evidence: "\n                    + ", ".join(sorted(missing_sources))\n                )\n            for source_id in normalized.source_full_evidence_ids:\n                source = full_by_id[source_id]\n                if source.run_outcome != CnvRunOutcomeState.OBSERVED:\n                    raise ValueError("Only observed full evidence can source a normalized event")\n                for field in identity_fields:\n                    if getattr(source, field) != getattr(normalized, field):\n                        raise ValueError(\n                            f"Normalized event identity mismatch for {field}: {source_id}"\n                        )\n'''
          new = '''            if missing_sources:\n                raise ValueError(\n                    "Normalized event references missing full evidence: "\n                    + ", ".join(sorted(missing_sources))\n                )\n            sources = [full_by_id[source_id] for source_id in normalized.source_full_evidence_ids]\n            locus_source_kinds = {\n                CnvEvidenceRecordKind.CALLER_BIN,\n                CnvEvidenceRecordKind.CALLER_SEGMENT,\n                CnvEvidenceRecordKind.CALLER_EVENT,\n                CnvEvidenceRecordKind.CHROMOSOME_SUMMARY,\n            }\n            if not any(\n                source.record_kind in locus_source_kinds and source.primary is not None\n                for source in sources\n            ):\n                raise ValueError(\n                    "Normalized positive event requires at least one locus-bearing caller source"\n                )\n            if (\n                normalized.contribution_status\n                == CnvContributionStatus.USED_FOR_PRIMARY_ANALYSIS\n                and not any(\n                    source.contribution_status\n                    == CnvContributionStatus.USED_FOR_PRIMARY_ANALYSIS\n                    for source in sources\n                )\n            ):\n                raise ValueError(\n                    "Primary normalized event requires at least one primary source-evidence record"\n                )\n            for source_id in normalized.source_full_evidence_ids:\n                source = full_by_id[source_id]\n                if source.run_outcome != CnvRunOutcomeState.OBSERVED:\n                    raise ValueError("Only observed full evidence can source a normalized event")\n                for field in identity_fields:\n                    if getattr(source, field) != getattr(normalized, field):\n                        raise ValueError(\n                            f"Normalized event identity mismatch for {field}: {source_id}"\n                        )\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one manifest source block, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
          PY
      - name: Canonical formatting and focused verification
        run: |
          ruff format src/ontseq_platform/cnv_validation_evidence.py tests/test_cnv_validation_evidence_review.py
          ruff check src/ontseq_platform/cnv_validation_evidence.py tests/test_cnv_validation_evidence_review.py
          python -m pytest -q \
            tests/test_cnv_validation_evidence.py \
            tests/test_cnv_validation_traceability.py \
            tests/test_cnv_validation_evidence_review.py
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ontseq_platform/cnv_validation_evidence.py \
            tests/test_cnv_validation_evidence_review.py
          git diff --cached --exit-code && { echo "Expected hardening diff was empty"; exit 1; } || true
          git commit -m "fix(cnv): harden normalized event source provenance"
          git push origin HEAD:feat/cnv-validation-program
