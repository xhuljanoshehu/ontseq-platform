name: One-shot Windows fixture repair

on:
  push:
    branches:
      - fix/methylation-modkit-060-migration

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Repair and verify Windows fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $patchLog = Join-Path $env:RUNNER_TEMP 'ontseq-patch.log'
          $testLog = Join-Path $env:RUNNER_TEMP 'ontseq-desktop-test.log'
          @'
          from pathlib import Path

          path = Path('desktop/ONTSeq.Desktop.Tests/Program.cs')
          data = path.read_bytes()
          replacements_lf = [
              (
                  b'''    var unsupportedRelativeOutput = Path.GetRelativePath(Environment.CurrentDirectory,
                  Path.Combine(root, "synthetic-relative-output-must-not-be-created"));
          ''',
                  b'''    // Path.GetRelativePath returns the absolute destination when the checkout and
              // temporary directory are on different Windows volumes. Keep this fixture
              // unconditionally relative so it tests validation rather than runner layout.
              var unsupportedRelativeOutput =
                  $"synthetic-relative-output-must-not-be-created-{Guid.NewGuid():N}";
          ''',
              ),
              (
                  b'''        package, "/home/synthetic/.local/share/ontseq/runtime-v0.7.1-synthetic");''',
                  b'''        package, "/home/synthetic/.local/share/ontseq/runtime-v0.8.1-synthetic");''',
              ),
          ]
          newline = b'\r\n' if b'\r\n' in data else b'\n'
          for old_lf, new_lf in replacements_lf:
              old = old_lf.replace(b'\n', newline)
              new = new_lf.replace(b'\n', newline)
              if data.count(old) != 1:
                  raise SystemExit(f'Expected one fixture match, found {data.count(old)}')
              data = data.replace(old, new, 1)
          path.write_bytes(data)
          print('patched relative path and runtime prefix fixtures')
          '@ | python - *>&1 | Tee-Object -FilePath $patchLog
          $patchExit = $LASTEXITCODE
          $testExit = 999
          if ($patchExit -eq 0) {
            & dotnet run --project desktop/ONTSeq.Desktop.Tests/ONTSeq.Desktop.Tests.csproj -c Release *>&1 |
              Tee-Object -FilePath $testLog
            $testExit = $LASTEXITCODE
          }

          if ($patchExit -eq 0 -and $testExit -eq 0) {
            Remove-Item '.github/windows-test-diagnostic.txt' -ErrorAction SilentlyContinue
            Remove-Item '.github/windows-fix-diagnostic.txt' -ErrorAction SilentlyContinue
            $message = 'fix(desktop): make Windows fixtures release-portable'
          }
          else {
            git checkout -- desktop/ONTSeq.Desktop.Tests/Program.cs
            @("patch_exit=$patchExit", "test_exit=$testExit", '--- patch ---') |
              Set-Content -Encoding utf8 '.github/windows-fix-diagnostic.txt'
            Get-Content $patchLog -Tail 80 |
              Add-Content -Encoding utf8 '.github/windows-fix-diagnostic.txt'
            if (Test-Path $testLog) {
              '--- test ---' | Add-Content -Encoding utf8 '.github/windows-fix-diagnostic.txt'
              Get-Content $testLog -Tail 250 |
                Add-Content -Encoding utf8 '.github/windows-fix-diagnostic.txt'
            }
            $message = 'ci: update Windows fixture repair diagnostic'
          }

          Remove-Item '.github/workflows/windows-test-fix.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m $message
          git push origin HEAD:${{ github.ref_name }}
          exit 0
