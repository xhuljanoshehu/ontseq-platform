name: One-shot typecheck diagnostic

on:
  push:
    branches:
      - feat/report-coverage-plots

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install package with dev tools
        run: python -m pip install -e '.[dev]'
      - name: Capture mypy output and publish diagnostic
        shell: bash
        run: |
          set +e
          mypy src > /tmp/mypy.log 2>&1
          status=$?
          { echo "mypy_exit=$status"; echo '--- mypy src ---'; cat /tmp/mypy.log; } > .github/pr1-typecheck-diagnostic.txt
          rm .github/workflows/pr1-typecheck.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: record typecheck diagnostic'
          git push origin HEAD:${{ github.ref_name }}
          exit 0
