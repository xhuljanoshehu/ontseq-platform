name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,workflow]"
      - name: Repository safety
        run: python scripts/check_repository_safety.py
      - name: Schemas are current
        run: python scripts/export_schemas.py --check
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy src
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate Snakemake DAGs
        run: |
          snakemake --snakefile workflow/benchmark.smk --dry-run --cores 1
          snakemake --snakefile workflow/aligned_bam.smk --dry-run --cores 4
      - name: Generate synthetic report bundle
        run: python -m ontseq_platform demo --output-dir results/demo
      - name: Upload synthetic bundle
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-report-bundle
          path: results/demo/
          if-no-files-found: error
