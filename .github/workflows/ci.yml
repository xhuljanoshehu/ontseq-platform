name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,workflow]"
      - name: Repository safety
        run: python scripts/check_repository_safety.py
      - name: Schemas are current
        run: python scripts/export_schemas.py --check
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy src
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate Snakemake DAGs
        run: |
          snakemake --snakefile workflow/benchmark.smk --dry-run --cores 1
          snakemake --snakefile workflow/aligned_bam.smk --dry-run --cores 4
      - name: Generate synthetic report bundle
        run: python -m ontseq_platform demo --output-dir results/demo
      - name: Upload synthetic bundle
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-report-bundle
          path: results/demo/
          if-no-files-found: error

  local-real-tool-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: workflow/envs/aligned_bam.yaml
          cache-environment: true
          post-cleanup: all
      - name: Run synthetic BAM through real local tools
        shell: micromamba-shell {0}
        run: >-
          PYTHONPATH=src python -m ontseq_platform local-smoke
          --output-dir results/local-smoke
          --git-commit "$GITHUB_SHA"
      - name: Prepare synthetic Adaptive Sampling manifest and ROI BED
        shell: micromamba-shell {0}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("results/local-smoke")
          manifest = json.loads((root / "synthetic.manifest.json").read_text(encoding="utf-8"))
          target_bed = root / "synthetic.analysis-roi.bed"
          target_bed.write_text(
              "chr1\t4800\t16000\tSYNTHETIC_TARGET_A\n"
              "chr2\t1000\t2000\tSYNTHETIC_TARGET_B\n",
              encoding="utf-8",
          )
          manifest["assay"]["mode"] = "adaptive_sampling"
          manifest["assay"]["target_bed"] = str(target_bed.resolve())
          manifest["assay"]["target_bed_version"] = "SYNTHETIC_ROI_V1"
          (root / "synthetic.adaptive.manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Run real Mosdepth target coverage QC
        shell: micromamba-shell {0}
        run: >-
          PYTHONPATH=src python -m ontseq_platform qc-target-coverage
          results/local-smoke/synthetic.adaptive.manifest.json
          --intake results/local-smoke/synthetic.intake.json
          --policy configs/qc/adaptive_target_coverage.technical.yaml
          --output-dir results/local-smoke/target-coverage-runtime
          --output results/local-smoke/synthetic.target-coverage.json
      - name: Upload synthetic reviewer artifacts (no BAM or VCF)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-real-tool-smoke
          path: |
            results/local-smoke/local-smoke.report.json
            results/local-smoke/SYNTHETIC_SMOKE_001.result.json
            results/local-smoke/SYNTHETIC_SMOKE_001.report.html
            results/local-smoke/SYNTHETIC_SMOKE_001.results.xlsx
            results/local-smoke/synthetic.intake.json
            results/local-smoke/synthetic.qc.json
            results/local-smoke/synthetic.sniffles.json
            results/local-smoke/synthetic.target-coverage.json
          if-no-files-found: error
