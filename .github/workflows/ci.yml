name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        id: install
        run: python -m pip install -e ".[dev,workflow]"
      - name: Repository safety
        run: python scripts/check_repository_safety.py
      - name: Schemas are current
        run: python scripts/export_schemas.py --check
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      # These two run even when an earlier check failed, because the job still reports
      # failure and one push should surface everything wrong with it. The alternative
      # costs a full round trip per layer: a lint error hides the type errors, which hide
      # the test failures. That is not hypothetical here — pydantic cannot be installed in
      # the development sandbox, so 21 of 36 test modules are first executed on this
      # runner, and a step that never runs is the most invisible way to be wrong.
      # Gated on Install so a broken environment does not produce a page of noise.
      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mypy src
      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m unittest discover -s tests -v
      - name: Validate Snakemake DAGs
        run: |
          snakemake --snakefile workflow/benchmark.smk --dry-run --cores 1
          snakemake --snakefile workflow/aligned_bam.smk --dry-run --cores 4
      - name: Generate synthetic report bundle
        run: python -m ontseq_platform demo --output-dir results/demo
      - name: Run the synthetic CNV benchmark end to end
        run: >-
          python -m ontseq_platform cnv-demo-benchmark
          --output-dir results/cnv-demo
      - name: Compare the two baseline configurations pairwise via the CLI
        run: >-
          python -m ontseq_platform cnv-compare-methods
          --method-a results/cnv-demo/evaluations/default/*.json
          --method-b results/cnv-demo/evaluations/conservative/*.json
          --output results/cnv-demo/cli-comparison.json
      - name: Convert a synthetic karyotype into CNV truth
        run: >-
          python -m ontseq_platform cnv-karyotype-truth
          --karyotype "46,XY,del(5)(q13q33),-7,+8,t(9;22)(q34;q11)"
          --cytobands examples/references/synthetic.cytobands.txt
          --cytoband-resource-id SYNTHETIC_CYTOBANDS_V1
          --genome-build GRCh38
          --truth-id SYNTHETIC_KARYO_001
          --sample-id SYNTHETIC_AML_001
          --source-version synthetic-cytobands-v1
          --output results/cnv-demo/karyotype-truth.json
      - name: Upload synthetic bundle
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-report-bundle
          path: results/demo/
          if-no-files-found: error
      - name: Upload synthetic CNV benchmark summary
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-cnv-benchmark
          path: |
            results/cnv-demo/cnv-demo.truth.json
            results/cnv-demo/cnv-demo.aggregate.default.json
            results/cnv-demo/cnv-demo.aggregate.conservative.json
            results/cnv-demo/cnv-demo.comparison.json
            results/cnv-demo/karyotype-truth.json
          if-no-files-found: error

  local-real-tool-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: workflow/envs/aligned_bam.yaml
          cache-environment: true
          post-cleanup: all
      - name: Run synthetic BAM through real local tools
        shell: micromamba-shell {0}
        run: >-
          PYTHONPATH=src python -m ontseq_platform local-smoke
          --output-dir results/local-smoke
          --git-commit "$GITHUB_SHA"
      - name: Preflight the run before starting it
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m ontseq_platform preflight \
            results/local-smoke/synthetic.manifest.json \
            --reference-lock results/local-smoke/synthetic.reference-lock.json \
            --output-dir results/runs \
            --run-id CI_RUN_001 | tee /tmp/preflight.log
          # The tools this lane needs were identified against the real binaries, and the
          # envelope this run is about to create is free.
          grep -qE '^\[ok  \] tool\.samtools' /tmp/preflight.log
          grep -qE '^\[ok  \] tool\.cramino' /tmp/preflight.log
          grep -qE '^\[ok  \] envelope\.lock' /tmp/preflight.log
          # An aligned-BAM run must not be asked to install a basecaller.
          if grep -q 'tool\.dorado' /tmp/preflight.log; then
            echo "preflight asked an aligned-BAM run for a basecaller"; exit 1
          fi
          # Preflight promises to leave nothing behind.
          if [ -e results/runs/CI_RUN_001 ]; then
            echo "preflight created a run envelope"; exit 1
          fi
      - name: Preflight refuses a run whose stated space requirement cannot be met
        shell: micromamba-shell {0}
        run: |
          set -uo pipefail
          PYTHONPATH=src python -m ontseq_platform preflight \
            results/local-smoke/synthetic.manifest.json \
            --reference-lock results/local-smoke/synthetic.reference-lock.json \
            --output-dir results/runs \
            --run-id CI_RUN_001 \
            --require-free-gb 1000000000 > /tmp/preflight-space.log 2>&1
          code=$?
          set -e
          cat /tmp/preflight-space.log
          test "$code" -eq 2
          grep -qE '^\[FAIL\] disk\.free' /tmp/preflight-space.log
      - name: Run the whole pipeline end to end with real tools
        shell: micromamba-shell {0}
        run: >-
          PYTHONPATH=src python -m ontseq_platform run
          results/local-smoke/synthetic.manifest.json
          --reference-lock results/local-smoke/synthetic.reference-lock.json
          --output-dir results/runs
          --run-id CI_RUN_001
          --threads 2
          --git-commit "$GITHUB_SHA"
      - name: Re-run to prove every stage resumes unchanged
        shell: micromamba-shell {0}
        run: |
          PYTHONPATH=src python -m ontseq_platform run \
            results/local-smoke/synthetic.manifest.json \
            --reference-lock results/local-smoke/synthetic.reference-lock.json \
            --output-dir results/runs \
            --run-id CI_RUN_001 \
            --threads 2 \
            --git-commit "$GITHUB_SHA" | tee /tmp/resume.log
          if grep -qE '^\s+\w+\s+(COMPLETED|NO_CALL)\s' /tmp/resume.log; then
            echo "A stage re-executed instead of resuming:"; cat /tmp/resume.log; exit 1
          fi
      - name: Verify the release bundle checksums independently
        shell: micromamba-shell {0}
        run: |
          cd results/runs/CI_RUN_001/SYNTHETIC_SMOKE_001
          sha256sum -c release/checksums.sha256
      - name: Refuse a second run on a locked envelope
        shell: micromamba-shell {0}
        run: |
          set -uo pipefail
          envelope=results/runs/CI_RUN_001/SYNTHETIC_SMOKE_001
          # The lock names this shell's PID, which stays alive for the whole step, so the
          # run meets a holder it cannot judge dead. Stale-reclaiming must not rescue it.
          python -c "import json,os,pathlib,socket,sys; pathlib.Path(sys.argv[1],'.ontseq-run.lock').write_text(json.dumps({'pid':int(sys.argv[2]),'hostname':socket.gethostname(),'acquired_at':'2026-01-01T00:00:00+00:00','run_id':'CI_RUN_001','sample_id':'SYNTHETIC_SMOKE_001','pipeline_version':'ci'}))" "$envelope" "$$"
          PYTHONPATH=src python -m ontseq_platform run \
            results/local-smoke/synthetic.manifest.json \
            --reference-lock results/local-smoke/synthetic.reference-lock.json \
            --output-dir results/runs --run-id CI_RUN_001 --threads 2 \
            --git-commit "$GITHUB_SHA" > /tmp/locked.log 2>&1
          status=$?
          cat /tmp/locked.log
          set -e
          # Exit 4 specifically: a scheduler has to tell "already running" from "failed".
          test "$status" -eq 4
          grep -q 'already in use' /tmp/locked.log
          rm "$envelope/.ontseq-run.lock"
      - name: Build the synthetic alignment-lane fixture
        shell: micromamba-shell {0}
        run: >-
          PYTHONPATH=src python -m ontseq_platform align-fixture
          --output-dir results/align-fixture
      - name: Preflight the alignment lane against its real reference
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m ontseq_platform preflight \
            results/align-fixture/synthetic.manifest.json \
            --reference-lock results/align-fixture/synthetic.reference-lock.json \
            --reference-fasta results/align-fixture/synthetic.reference.fasta \
            --output-dir results/runs \
            --run-id CI_ALIGN_001 | tee /tmp/preflight-align.log
          # The lock records the checksum of the .fai it was built from, so this asserts
          # that preflight recomputes it the same way `ontseq reference-lock` wrote it.
          grep -qE '^\[ok  \] reference\.fai .*matches the lock checksum' \
            /tmp/preflight-align.log
          grep -qE '^\[ok  \] tool\.minimap2' /tmp/preflight-align.log
      - name: Preflight refuses the alignment lane against the wrong reference
        shell: micromamba-shell {0}
        run: |
          set -uo pipefail
          # The smoke lane's reference is a different synthetic genome. Pointing this run
          # at it is the mistake that silently produces confidently wrong coordinates, so
          # preflight must refuse before minimap2 is ever invoked.
          PYTHONPATH=src python -m ontseq_platform preflight \
            results/align-fixture/synthetic.manifest.json \
            --reference-lock results/local-smoke/synthetic.reference-lock.json \
            --reference-fasta results/align-fixture/synthetic.reference.fasta \
            --output-dir results/runs \
            --run-id CI_ALIGN_001 > /tmp/preflight-wrong-ref.log 2>&1
          code=$?
          set -e
          cat /tmp/preflight-wrong-ref.log
          test "$code" -eq 2
          grep -qE '^\[FAIL\] reference\.fai' /tmp/preflight-wrong-ref.log
      - name: Run the unaligned-BAM lane through real minimap2
        shell: micromamba-shell {0}
        run: >-
          PYTHONPATH=src python -m ontseq_platform run
          results/align-fixture/synthetic.manifest.json
          --reference-lock results/align-fixture/synthetic.reference-lock.json
          --reference-fasta results/align-fixture/synthetic.reference.fasta
          --output-dir results/runs
          --run-id CI_ALIGN_001
          --threads 2
          --git-commit "$GITHUB_SHA"
      - name: Prove the alignment kept mapping, read groups and base modifications
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          bam=results/runs/CI_ALIGN_001/SYNTHETIC_ALIGN_001/alignment/SYNTHETIC_ALIGN_001.bam
          mapped=$(samtools view -c -F 0x904 "$bam")
          reverse=$(samtools view -c -f 16 -F 0x900 "$bam")
          echo "primary mapped=$mapped reverse-strand=$reverse"
          # 24 reads go in and all are carved from the reference, so all must map. The
          # reverse-complemented ones must land on the reverse strand, or the fixture is
          # not exercising the path it claims to exercise.
          test "$mapped" -eq 24
          test "$reverse" -ge 4
          # Dumped to files rather than piped into grep: `grep -q` exits on its first
          # match, and under `pipefail` the resulting SIGPIPE in samtools fails the step
          # precisely when the assertion succeeded.
          samtools view -H "$bam" > /tmp/align.header.sam
          samtools view "$bam" > /tmp/align.records.sam
          samtools view -f 16 "$bam" > /tmp/align.reverse.sam
          # Read groups survive only if the header was re-attached after the FASTQ round
          # trip and the per-read RG tag was carried through. Both groups are asserted:
          # with one group a bug collapsing every read onto the first group is invisible,
          # and a real ONT sample is routinely sequenced across several flowcells.
          grep -q '^@RG.*ID:SYNTHETIC_ALIGN_RG\b.*SM:SYNTHETIC_ALIGN_001' /tmp/align.header.sam
          grep -q '^@RG.*ID:SYNTHETIC_ALIGN_RG2.*SM:SYNTHETIC_ALIGN_001' /tmp/align.header.sam
          grep -q 'RG:Z:SYNTHETIC_ALIGN_RG\b' /tmp/align.records.sam
          grep -q 'RG:Z:SYNTHETIC_ALIGN_RG2' /tmp/align.records.sam
          # Every read keeps the group it came in with. Counting proves no read was
          # reassigned, which a per-group presence check alone would not.
          first=$(grep -c 'RG:Z:SYNTHETIC_ALIGN_RG\b' /tmp/align.records.sam)
          second=$(grep -c 'RG:Z:SYNTHETIC_ALIGN_RG2' /tmp/align.records.sam)
          echo "read groups: first=$first second=$second"
          test "$second" -ge 4
          test "$first" -ge 20
          grep -q 'MM:Z:C+m?' /tmp/align.records.sam
          grep -q 'ML:B:C,' /tmp/align.records.sam
          grep -q 'MD:Z:' /tmp/align.records.sam
          # Modified-base tags must survive on reverse-strand records too, which is where
          # a FASTQ round trip is most likely to lose them.
          grep -q 'MM:Z:C+m?' /tmp/align.reverse.sam
      - name: Re-run the alignment lane to prove it resumes unchanged
        shell: micromamba-shell {0}
        run: |
          PYTHONPATH=src python -m ontseq_platform run \
            results/align-fixture/synthetic.manifest.json \
            --reference-lock results/align-fixture/synthetic.reference-lock.json \
            --reference-fasta results/align-fixture/synthetic.reference.fasta \
            --output-dir results/runs \
            --run-id CI_ALIGN_001 \
            --threads 2 \
            --git-commit "$GITHUB_SHA" | tee /tmp/resume-align.log
          if grep -qE '^\s+\w+\s+(COMPLETED|NO_CALL)\s' /tmp/resume-align.log; then
            echo "A stage re-executed instead of resuming:"; cat /tmp/resume-align.log; exit 1
          fi
      - name: Verify the alignment-lane release bundle checksums independently
        shell: micromamba-shell {0}
        run: |
          cd results/runs/CI_ALIGN_001/SYNTHETIC_ALIGN_001
          sha256sum -c release/checksums.sha256
      - name: Drive a watch folder end to end with real tools
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          # One drop directory per sample, built from the smoke fixture's real BAM.
          mkdir -p results/drop/WATCHED_SAMPLE_001
          cp results/local-smoke/synthetic.sorted.bam \
             results/drop/WATCHED_SAMPLE_001/reads.bam
          cp results/local-smoke/synthetic.sorted.bam.bai \
             results/drop/WATCHED_SAMPLE_001/reads.bam.bai
          # A directory nobody can name a sample after: it must be rejected, not repaired.
          mkdir -p "results/drop/not a sample id"
          cp results/local-smoke/synthetic.sorted.bam "results/drop/not a sample id/reads.bam"
          # An assay-level template: identity and input path are the watcher's job, and
          # everything here is a constant of the assay rather than of the sample.
          python -c "import json,pathlib; pathlib.Path('results/watch.manifest.json').write_text(json.dumps({'schema_version':'0.1.0','run_id':'CI_WATCH_RUN','assay':{'mode':'lcwgs','genome_build':'GRCh38','reference_id':'SYNTHETIC_NOT_REAL_GRCH38_V1'},'analysis':{'profile':'lcwgs','modules':['qc','sv','report']}}))"
          PYTHONPATH=src python -m ontseq_platform watch results/drop \
            --manifest-template results/watch.manifest.json \
            --reference-lock results/local-smoke/synthetic.reference-lock.json \
            --input-kind aligned_bam \
            --output-dir results/watched \
            --quiet-seconds 0 --threads 2 --once \
            --git-commit "$GITHUB_SHA" | tee /tmp/watch.log
          grep -q 'WATCHED_SAMPLE_001 *COMPLETED' /tmp/watch.log
          grep -q 'REJECTED' /tmp/watch.log
          test -f results/watched/WATCHED_SAMPLE_001/WATCHED_SAMPLE_001/provenance/run.json
          test -f results/watched/.ontseq-watch.json
          # The drop folder is an input area: nothing of ours may be written into it.
          test -z "$(find results/drop -name '.ontseq*')"
      - name: Re-run the watch folder to prove finished samples are not repeated
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m ontseq_platform watch results/drop \
            --manifest-template results/watch.manifest.json \
            --reference-lock results/local-smoke/synthetic.reference-lock.json \
            --input-kind aligned_bam \
            --output-dir results/watched \
            --quiet-seconds 0 --threads 2 --once \
            --git-commit "$GITHUB_SHA" | tee /tmp/watch2.log
          grep -q 'WATCHED_SAMPLE_001 *skipped *already completed' /tmp/watch2.log
      - name: Annotate a real result against a locked ClinVar release
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          result=results/runs/CI_RUN_001/SYNTHETIC_SMOKE_001/normalized/SYNTHETIC_SMOKE_001.result.json
          PYTHONPATH=src python -m ontseq_platform annotate "$result" \
            --clinvar examples/knowledge/synthetic.clinvar.variant_summary.txt \
            --release CI-SYNTHETIC-2026-08-01 \
            --output /tmp/annotated.json | tee /tmp/annotate.log
          # The loader must report what it skipped, or an assembly mismatch looks exactly
          # like a sample nobody knows anything about.
          grep -q 'for another assembly' /tmp/annotate.log
          grep -q 'without a matchable extent' /tmp/annotate.log
          grep -q 'does not make a finding reportable\|makes a finding reportable' /tmp/annotate.log
      - name: Prove annotation never touches a judgement field
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          result=results/runs/CI_RUN_001/SYNTHETIC_SMOKE_001/normalized/SYNTHETIC_SMOKE_001.result.json
          python -c "import json,sys;a=json.load(open(sys.argv[1]));b=json.load(open(sys.argv[2]));ea={e['event_id']:e for e in a['events']};eb={e['event_id']:e for e in b['events']};assert ea.keys()==eb.keys(),'event set changed';[sys.exit('judgement field changed for '+k) for k in ea if (ea[k]['reportable'],ea[k]['confidence'])!=(eb[k]['reportable'],eb[k]['confidence'])];print('reportable and confidence unchanged for',len(ea),'event(s)')" "$result" /tmp/annotated.json
          # Every annotation must carry its caveats; the contract refuses an empty list.
          python -c "import json;d=json.load(open('/tmp/annotated.json'));anns=[x for e in d['events'] for x in e['annotations']];print(len(anns),'annotation(s)');assert anns,'nothing was annotated, so this step proved nothing';assert all(x['caveats'] for x in anns),'an annotation carried no caveats';assert all(x['assertion_vocabulary']=='acmg_germline' for x in anns),'vocabulary was not carried';assert any(x['scope_alignment']=='mismatched' for x in anns),'the germline-under-somatic case was not exercised';assert all(x['source_release']=='CI-SYNTHETIC-2026-08-01' for x in anns),'the release was not recorded'"
          PYTHONPATH=src python -m ontseq_platform validate-result /tmp/annotated.json
      - name: Sign off a run and prove the trail binds to what was signed
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          envelope=results/runs/CI_RUN_001/SYNTHETIC_SMOKE_001
          # Nothing reviewed yet: unfinished, not wrong.
          set +e
          PYTHONPATH=src python -m ontseq_platform review status "$envelope" > /tmp/rev0.log 2>&1
          code=$?
          set -e
          cat /tmp/rev0.log
          test "$code" -eq 6
          grep -q 'PENDING' /tmp/rev0.log

          PYTHONPATH=src python -m ontseq_platform review record "$envelope" \
            --decision accepted --reviewer dr.mueller --note "CI sign-off" | tee /tmp/rev1.log
          grep -q 'bound to release bundle' /tmp/rev1.log
          PYTHONPATH=src python -m ontseq_platform review status "$envelope" --verbose \
            | tee /tmp/rev2.log
          grep -q 'ACCEPTED' /tmp/rev2.log
          grep -q 'chain: intact' /tmp/rev2.log
          # The record must never imply an authentication it does not perform.
          grep -q 'asserted, not authenticated' /tmp/rev2.log
          PYTHONPATH=src python -m ontseq_platform review status "$envelope" --json \
            > /tmp/rev.json
          python -c "import json;d=json.load(open('/tmp/rev.json'));assert d['state']=='accepted',d;assert d['accepted_by']==['dr.mueller'],d;assert d['identity_is_authenticated'] is False,d;assert d['chain_is_tamper_proof'] is False,d"

          # A four-eyes gate is not satisfied by one person.
          set +e
          PYTHONPATH=src python -m ontseq_platform review status "$envelope" \
            --require-reviewers 2 > /tmp/rev3.log 2>&1
          code=$?
          set -e
          test "$code" -eq 6
      - name: Refuse to re-run an envelope somebody signed off
        shell: micromamba-shell {0}
        run: |
          set +e
          PYTHONPATH=src python -m ontseq_platform run \
            results/local-smoke/synthetic.manifest.json \
            --reference-lock results/local-smoke/synthetic.reference-lock.json \
            --output-dir results/runs --run-id CI_RUN_001 --threads 2 \
            --git-commit "$GITHUB_SHA" > /tmp/rerun.log 2>&1
          code=$?
          set -e
          cat /tmp/rerun.log
          # Exit 7 is its own code: a scheduler must tell this apart from an ordinary
          # failure and from a locked envelope.
          test "$code" -eq 7
          grep -q 'accepted review' /tmp/rerun.log
      - name: Prove an edited review trail is detected
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          log=results/runs/CI_RUN_001/SYNTHETIC_SMOKE_001/review/review.log.jsonl
          cp "$log" /tmp/review.backup
          python -c "import json;p='$log';rows=[json.loads(l) for l in open(p) if l.strip()];rows[0]['note']='tampered';open(p,'w').write(''.join(json.dumps(r,sort_keys=True,separators=(',',':'))+chr(10) for r in rows))"
          set +e
          PYTHONPATH=src python -m ontseq_platform review status \
            results/runs/CI_RUN_001/SYNTHETIC_SMOKE_001 > /tmp/rev4.log 2>&1
          code=$?
          set -e
          cat /tmp/rev4.log
          test "$code" -eq 2
          grep -q 'BROKEN' /tmp/rev4.log
          cp /tmp/review.backup "$log"
      - name: Report the state of every envelope the job produced
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m ontseq_platform status results/runs --verbose \
            | tee /tmp/status.log
          grep -q 'CI_RUN_001/SYNTHETIC_SMOKE_001 *PASSED' /tmp/status.log
          grep -q 'CI_ALIGN_001/SYNTHETIC_ALIGN_001 *PASSED' /tmp/status.log
          # The watch folder's own output directory carries its ledger alongside the runs.
          PYTHONPATH=src python -m ontseq_platform status results/watched | tee /tmp/watched.log
          grep -q 'watch ledger' /tmp/watched.log
          # The operator surface must show the sign-off state, or an operator scanning many
          # envelopes has to run a second command per envelope to learn it.
          grep -q 'review: ACCEPTED' /tmp/status.log
          PYTHONPATH=src python -m ontseq_platform status results/runs --json > /tmp/status.json
          python -c "import json,sys; d=json.load(open('/tmp/status.json')); assert all(i['state']=='passed' for i in d), d; print(f'{len(d)} envelope(s) reported')"
      - name: Upload synthetic reviewer artifacts (no BAM or VCF)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-real-tool-smoke
          path: |
            results/local-smoke/local-smoke.report.json
            results/local-smoke/SYNTHETIC_SMOKE_001.result.json
            results/local-smoke/SYNTHETIC_SMOKE_001.report.html
            results/local-smoke/SYNTHETIC_SMOKE_001.results.xlsx
            results/local-smoke/synthetic.intake.json
            results/local-smoke/synthetic.qc.json
            results/local-smoke/synthetic.sniffles.json
            results/runs/CI_RUN_001/SYNTHETIC_SMOKE_001/provenance/run.json
