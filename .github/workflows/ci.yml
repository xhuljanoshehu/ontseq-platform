name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,workflow]"
      - name: Repository safety
        run: python scripts/check_repository_safety.py
      - name: Schemas are current
        run: python scripts/export_schemas.py --check
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy src
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate Snakemake DAGs
        run: |
          snakemake --snakefile workflow/benchmark.smk --dry-run --cores 1
          snakemake --snakefile workflow/aligned_bam.smk --dry-run --cores 4
      - name: Generate synthetic report bundle
        run: python -m ontseq_platform demo --output-dir results/demo
      - name: Run the synthetic CNV benchmark end to end
        run: >-
          python -m ontseq_platform cnv-demo-benchmark
          --output-dir results/cnv-demo
      - name: Compare the two baseline configurations pairwise via the CLI
        run: >-
          python -m ontseq_platform cnv-compare-methods
          --method-a results/cnv-demo/evaluations/default/*.json
          --method-b results/cnv-demo/evaluations/conservative/*.json
          --output results/cnv-demo/cli-comparison.json
      - name: Convert a synthetic karyotype into CNV truth
        run: >-
          python -m ontseq_platform cnv-karyotype-truth
          --karyotype "46,XY,del(5)(q13q33),-7,+8,t(9;22)(q34;q11)"
          --cytobands examples/references/synthetic.cytobands.txt
          --cytoband-resource-id SYNTHETIC_CYTOBANDS_V1
          --genome-build GRCh38
          --truth-id SYNTHETIC_KARYO_001
          --sample-id SYNTHETIC_AML_001
          --source-version synthetic-cytobands-v1
          --output results/cnv-demo/karyotype-truth.json
      - name: Upload synthetic bundle
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-report-bundle
          path: results/demo/
          if-no-files-found: error
      - name: Upload synthetic CNV benchmark summary
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-cnv-benchmark
          path: |
            results/cnv-demo/cnv-demo.truth.json
            results/cnv-demo/cnv-demo.aggregate.default.json
            results/cnv-demo/cnv-demo.aggregate.conservative.json
            results/cnv-demo/cnv-demo.comparison.json
            results/cnv-demo/karyotype-truth.json
          if-no-files-found: error

  local-real-tool-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: workflow/envs/aligned_bam.yaml
          cache-environment: true
          post-cleanup: all
      - name: Run synthetic BAM through real local tools
        shell: micromamba-shell {0}
        run: >-
          PYTHONPATH=src python -m ontseq_platform local-smoke
          --output-dir results/local-smoke
          --git-commit "$GITHUB_SHA"
      - name: Run the whole pipeline end to end with real tools
        shell: micromamba-shell {0}
        run: >-
          PYTHONPATH=src python -m ontseq_platform run
          results/local-smoke/synthetic.manifest.json
          --reference-lock results/local-smoke/synthetic.reference-lock.json
          --output-dir results/runs
          --run-id CI_RUN_001
          --threads 2
          --git-commit "$GITHUB_SHA"
      - name: Re-run to prove every stage resumes unchanged
        shell: micromamba-shell {0}
        run: |
          PYTHONPATH=src python -m ontseq_platform run \
            results/local-smoke/synthetic.manifest.json \
            --reference-lock results/local-smoke/synthetic.reference-lock.json \
            --output-dir results/runs \
            --run-id CI_RUN_001 \
            --threads 2 \
            --git-commit "$GITHUB_SHA" | tee /tmp/resume.log
          if grep -qE '^\s+\w+\s+(COMPLETED|NO_CALL)\s' /tmp/resume.log; then
            echo "A stage re-executed instead of resuming:"; cat /tmp/resume.log; exit 1
          fi
      - name: Verify the release bundle checksums independently
        shell: micromamba-shell {0}
        run: |
          cd results/runs/CI_RUN_001/SYNTHETIC_SMOKE_001
          sha256sum -c release/checksums.sha256
      - name: Refuse a second run on a locked envelope
        shell: micromamba-shell {0}
        run: |
          set -uo pipefail
          envelope=results/runs/CI_RUN_001/SYNTHETIC_SMOKE_001
          # The lock names this shell's PID, which stays alive for the whole step, so the
          # run meets a holder it cannot judge dead. Stale-reclaiming must not rescue it.
          python -c "import json,os,pathlib,socket,sys; pathlib.Path(sys.argv[1],'.ontseq-run.lock').write_text(json.dumps({'pid':int(sys.argv[2]),'hostname':socket.gethostname(),'acquired_at':'2026-01-01T00:00:00+00:00','run_id':'CI_RUN_001','sample_id':'SYNTHETIC_SMOKE_001','pipeline_version':'ci'}))" "$envelope" "$$"
          PYTHONPATH=src python -m ontseq_platform run \
            results/local-smoke/synthetic.manifest.json \
            --reference-lock results/local-smoke/synthetic.reference-lock.json \
            --output-dir results/runs --run-id CI_RUN_001 --threads 2 \
            --git-commit "$GITHUB_SHA" > /tmp/locked.log 2>&1
          status=$?
          cat /tmp/locked.log
          set -e
          # Exit 4 specifically: a scheduler has to tell "already running" from "failed".
          test "$status" -eq 4
          grep -q 'already in use' /tmp/locked.log
          rm "$envelope/.ontseq-run.lock"
      - name: Build the synthetic alignment-lane fixture
        shell: micromamba-shell {0}
        run: >-
          PYTHONPATH=src python -m ontseq_platform align-fixture
          --output-dir results/align-fixture
      - name: Run the unaligned-BAM lane through real minimap2
        shell: micromamba-shell {0}
        run: >-
          PYTHONPATH=src python -m ontseq_platform run
          results/align-fixture/synthetic.manifest.json
          --reference-lock results/align-fixture/synthetic.reference-lock.json
          --reference-fasta results/align-fixture/synthetic.reference.fasta
          --output-dir results/runs
          --run-id CI_ALIGN_001
          --threads 2
          --git-commit "$GITHUB_SHA"
      - name: Prove the alignment kept mapping, read groups and base modifications
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          bam=results/runs/CI_ALIGN_001/SYNTHETIC_ALIGN_001/alignment/SYNTHETIC_ALIGN_001.bam
          mapped=$(samtools view -c -F 0x904 "$bam")
          reverse=$(samtools view -c -f 16 -F 0x900 "$bam")
          echo "primary mapped=$mapped reverse-strand=$reverse"
          # 24 reads go in and all are carved from the reference, so all must map. The
          # reverse-complemented ones must land on the reverse strand, or the fixture is
          # not exercising the path it claims to exercise.
          test "$mapped" -eq 24
          test "$reverse" -ge 4
          # Dumped to files rather than piped into grep: `grep -q` exits on its first
          # match, and under `pipefail` the resulting SIGPIPE in samtools fails the step
          # precisely when the assertion succeeded.
          samtools view -H "$bam" > /tmp/align.header.sam
          samtools view "$bam" > /tmp/align.records.sam
          samtools view -f 16 "$bam" > /tmp/align.reverse.sam
          # Read groups survive only if the header was re-attached after the FASTQ round
          # trip and the per-read RG tag was carried through.
          grep -q '^@RG.*SM:SYNTHETIC_ALIGN_001' /tmp/align.header.sam
          grep -q 'RG:Z:SYNTHETIC_ALIGN_RG' /tmp/align.records.sam
          grep -q 'MM:Z:C+m?' /tmp/align.records.sam
          grep -q 'ML:B:C,' /tmp/align.records.sam
          grep -q 'MD:Z:' /tmp/align.records.sam
          # Modified-base tags must survive on reverse-strand records too, which is where
          # a FASTQ round trip is most likely to lose them.
          grep -q 'MM:Z:C+m?' /tmp/align.reverse.sam
      - name: Re-run the alignment lane to prove it resumes unchanged
        shell: micromamba-shell {0}
        run: |
          PYTHONPATH=src python -m ontseq_platform run \
            results/align-fixture/synthetic.manifest.json \
            --reference-lock results/align-fixture/synthetic.reference-lock.json \
            --reference-fasta results/align-fixture/synthetic.reference.fasta \
            --output-dir results/runs \
            --run-id CI_ALIGN_001 \
            --threads 2 \
            --git-commit "$GITHUB_SHA" | tee /tmp/resume-align.log
          if grep -qE '^\s+\w+\s+(COMPLETED|NO_CALL)\s' /tmp/resume-align.log; then
            echo "A stage re-executed instead of resuming:"; cat /tmp/resume-align.log; exit 1
          fi
      - name: Verify the alignment-lane release bundle checksums independently
        shell: micromamba-shell {0}
        run: |
          cd results/runs/CI_ALIGN_001/SYNTHETIC_ALIGN_001
          sha256sum -c release/checksums.sha256
      - name: Drive a watch folder end to end with real tools
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          # One drop directory per sample, built from the smoke fixture's real BAM.
          mkdir -p results/drop/WATCHED_SAMPLE_001
          cp results/local-smoke/synthetic.sorted.bam \
             results/drop/WATCHED_SAMPLE_001/reads.bam
          cp results/local-smoke/synthetic.sorted.bam.bai \
             results/drop/WATCHED_SAMPLE_001/reads.bam.bai
          # A directory nobody can name a sample after: it must be rejected, not repaired.
          mkdir -p "results/drop/not a sample id"
          cp results/local-smoke/synthetic.sorted.bam "results/drop/not a sample id/reads.bam"
          # An assay-level template: identity and input path are the watcher's job, and
          # everything here is a constant of the assay rather than of the sample.
          python -c "import json,pathlib; pathlib.Path('results/watch.manifest.json').write_text(json.dumps({'schema_version':'0.1.0','run_id':'CI_WATCH_RUN','assay':{'mode':'lcwgs','genome_build':'GRCh38','reference_id':'SYNTHETIC_NOT_REAL_GRCH38_V1'},'analysis':{'profile':'lcwgs','modules':['qc','sv','report']}}))"
          PYTHONPATH=src python -m ontseq_platform watch results/drop \
            --manifest-template results/watch.manifest.json \
            --reference-lock results/local-smoke/synthetic.reference-lock.json \
            --input-kind aligned_bam \
            --output-dir results/watched \
            --quiet-seconds 0 --threads 2 --once \
            --git-commit "$GITHUB_SHA" | tee /tmp/watch.log
          grep -q 'WATCHED_SAMPLE_001 *COMPLETED' /tmp/watch.log
          grep -q 'REJECTED' /tmp/watch.log
          test -f results/watched/WATCHED_SAMPLE_001/WATCHED_SAMPLE_001/provenance/run.json
          test -f results/watched/.ontseq-watch.json
          # The drop folder is an input area: nothing of ours may be written into it.
          test -z "$(find results/drop -name '.ontseq*')"
      - name: Re-run the watch folder to prove finished samples are not repeated
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m ontseq_platform watch results/drop \
            --manifest-template results/watch.manifest.json \
            --reference-lock results/local-smoke/synthetic.reference-lock.json \
            --input-kind aligned_bam \
            --output-dir results/watched \
            --quiet-seconds 0 --threads 2 --once \
            --git-commit "$GITHUB_SHA" | tee /tmp/watch2.log
          grep -q 'WATCHED_SAMPLE_001 *skipped *already completed' /tmp/watch2.log
      - name: Report the state of every envelope the job produced
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m ontseq_platform status results/runs --verbose \
            | tee /tmp/status.log
          grep -q 'CI_RUN_001/SYNTHETIC_SMOKE_001 *PASSED' /tmp/status.log
          grep -q 'CI_ALIGN_001/SYNTHETIC_ALIGN_001 *PASSED' /tmp/status.log
          # The watch folder's own output directory carries its ledger alongside the runs.
          PYTHONPATH=src python -m ontseq_platform status results/watched | tee /tmp/watched.log
          grep -q 'watch ledger' /tmp/watched.log
          PYTHONPATH=src python -m ontseq_platform status results/runs --json > /tmp/status.json
          python -c "import json,sys; d=json.load(open('/tmp/status.json')); assert all(i['state']=='passed' for i in d), d; print(f'{len(d)} envelope(s) reported')"
      - name: Upload synthetic reviewer artifacts (no BAM or VCF)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-real-tool-smoke
          path: |
            results/local-smoke/local-smoke.report.json
            results/local-smoke/SYNTHETIC_SMOKE_001.result.json
            results/local-smoke/SYNTHETIC_SMOKE_001.report.html
            results/local-smoke/SYNTHETIC_SMOKE_001.results.xlsx
            results/local-smoke/synthetic.intake.json
            results/local-smoke/synthetic.qc.json
            results/local-smoke/synthetic.sniffles.json
            results/runs/CI_RUN_001/SYNTHETIC_SMOKE_001/provenance/run.json
            results/runs/CI_RUN_001/SYNTHETIC_SMOKE_001/release/release.json
            results/runs/CI_RUN_001/SYNTHETIC_SMOKE_001/release/checksums.sha256
            results/runs/CI_ALIGN_001/SYNTHETIC_ALIGN_001/provenance/run.json
            results/runs/CI_ALIGN_001/SYNTHETIC_ALIGN_001/provenance/alignment.json
            results/runs/CI_ALIGN_001/SYNTHETIC_ALIGN_001/release/release.json
          if-no-files-found: error
