name: One-shot Windows test diagnostic

on:
  push:
    branches:
      - fix/methylation-modkit-060-migration

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Capture desktop test output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:RUNNER_TEMP 'ontseq-desktop-test.log'
          & dotnet run --project desktop/ONTSeq.Desktop.Tests/ONTSeq.Desktop.Tests.csproj -c Release *>&1 |
            Tee-Object -FilePath $log
          $testExit = $LASTEXITCODE
          $diagnostic = '.github/windows-test-diagnostic.txt'
          "exit_code=$testExit" | Set-Content -Encoding utf8 $diagnostic
          Get-Content $log -Tail 250 | Add-Content -Encoding utf8 $diagnostic
          Remove-Item '.github/workflows/windows-test-diagnostic.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'ci: record Windows desktop test failure'
          git push origin HEAD:${{ github.ref_name }}
          exit 0
