name: Format quantitation PR

on:
  push:
    branches:
      - fix/quantitation-model-invariants

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Format, verify, and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m pip install --disable-pip-version-check -q -e ".[dev]"
          ruff format src/ontseq_platform/quantitation.py tests/test_quantitation.py
          ruff check .
          ruff format --check .
          mypy src
          pytest -q tests/test_quantitation.py
          rm -f .github/workflows/quantitation-format.yml
          git add -A
          git diff --cached --check
          git commit -m "style: format quantitation invariant repair"
          git push origin HEAD:fix/quantitation-model-invariants
