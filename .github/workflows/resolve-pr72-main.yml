name: Resolve PR 72 against current main

on:
  push:
    branches:
      - fix/desktop-bundle-0.8.2-active

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Merge current main and preserve both changelog histories
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          start = text.index("## 0.8.2 —")
          end = text.index("## 0.8.1 —", start)
          block = text[start:end]
          block = block.replace("## 0.8.2 — 2026-09-11", "## 0.8.2 — 2026-09-12", 1)
          Path("/tmp/pr72-release-section.md").write_text(block, encoding="utf-8")
          PY
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          conflicts=$(git diff --name-only --diff-filter=U)
          if [ "$merge_status" -eq 0 ] || [ "$conflicts" != "CHANGELOG.md" ]; then
            echo "Expected only CHANGELOG.md conflict; merge_status=$merge_status conflicts=$conflicts" >&2
            exit 1
          fi
          git checkout --theirs CHANGELOG.md
          python - <<'PY'
          from pathlib import Path
          path = Path("CHANGELOG.md")
          main = path.read_text(encoding="utf-8")
          release = Path("/tmp/pr72-release-section.md").read_text(encoding="utf-8")
          marker = "## 0.8.1 —"
          if main.count(marker) != 1 or "## 0.8.2 —" in main:
              raise SystemExit("Unexpected current-main changelog structure")
          path.write_text(main.replace(marker, release + marker, 1), encoding="utf-8")
          PY
          rm -f .github/pr72-conflicts.txt .github/pr72-merge-output.txt
          rm -f .github/workflows/resolve-pr72-main.yml
          git add -A
          git commit -m 'merge: reconcile Windows bundle 0.8.2 with current main'
          git push origin HEAD:${{ github.ref_name }}
