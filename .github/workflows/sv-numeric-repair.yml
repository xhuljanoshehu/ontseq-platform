name: Repair SV numeric invariants

on:
  push:
    branches:
      - fix/sv-nonfinite-numeric-invariants

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Add regressions, reject non-finite caller values, verify and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cat > tests/test_sv_numeric_invariants.py <<'PY'
          from __future__ import annotations

          import tempfile
          import unittest
          from pathlib import Path

          from ontseq_platform.cutesv import normalize_cutesv_vcf
          from ontseq_platform.models import CuteSvPolicy, GenomeBuild, SnifflesPolicy, ToolRecord
          from ontseq_platform.sniffles import normalize_sniffles_vcf


          def _write(path: Path, body: str) -> None:
              path.write_text(
                  "##fileformat=VCFv4.2\n"
                  "#CHROM\tPOS\tID\tREF\tALT\tQUAL\tFILTER\tINFO\tFORMAT\tS\n"
                  + body,
                  encoding="utf-8",
              )


          class SvNumericInvariantTests(unittest.TestCase):
              def test_sniffles_rejects_nonfinite_quality_and_coverage(self) -> None:
                  policy = SnifflesPolicy(
                      profile_id="test",
                      status="technical_defaults_only",
                      min_support=5,
                      min_sv_length=50,
                      mapq=20,
                      note="test",
                  )
                  tool = ToolRecord(name="Sniffles2", version=policy.expected_version)
                  rows = {
                      "quality": (
                          "chr1\t1000\t.\tN\t<DEL>\tinf\tPASS\t"
                          "SVTYPE=DEL;END=1200;SVLEN=-201;SUPPORT=8\tGT:DR:DV\t0/1:8:8\n",
                          "malformed_quality",
                      ),
                      "coverage": (
                          "chr1\t1000\t.\tN\t<DEL>\t60\tPASS\t"
                          "SVTYPE=DEL;END=1200;SVLEN=-201;SUPPORT=8;COVERAGE=10,inf\t"
                          "GT:DR:DV\t0/1:8:8\n",
                          "malformed_coverage",
                      ),
                      "vaf": (
                          "chr1\t1000\t.\tN\t<DEL>\t60\tPASS\t"
                          "SVTYPE=DEL;END=1200;SVLEN=-201;SUPPORT=8;VAF=nan\t"
                          "GT:DR:DV\t0/1:8:8\n",
                          "malformed_vaf",
                      ),
                  }
                  with tempfile.TemporaryDirectory() as raw:
                      path = Path(raw) / "sniffles.vcf"
                      for name, (row, reason) in rows.items():
                          with self.subTest(name=name):
                              _write(path, row)
                              report = normalize_sniffles_vcf(
                                  path,
                                  sample_id="S",
                                  genome_build=GenomeBuild.GRCH38,
                                  policy=policy,
                                  tool=tool,
                              )
                              self.assertEqual(report.accepted_record_count, 0)
                              self.assertEqual(report.rejection_counts, {reason: 1})

              def test_cutesv_rejects_nonfinite_quality(self) -> None:
                  policy = CuteSvPolicy(
                      profile_id="test",
                      status="technical_defaults_only",
                      note="test",
                  )
                  tool = ToolRecord(name="cuteSV", version=policy.expected_version)
                  with tempfile.TemporaryDirectory() as raw:
                      path = Path(raw) / "cutesv.vcf"
                      _write(
                          path,
                          "chr1\t1000\t.\tN\t<DEL>\tinf\tPASS\t"
                          "SVTYPE=DEL;END=1200;SVLEN=-201;RE=8\tGT:DR:DV\t0/1:8:8\n",
                      )
                      report = normalize_cutesv_vcf(
                          path,
                          sample_id="S",
                          genome_build=GenomeBuild.GRCH38,
                          policy=policy,
                          tool=tool,
                      )
                      self.assertEqual(report.accepted_record_count, 0)
                      self.assertEqual(report.rejection_counts, {"malformed_quality": 1})


          if __name__ == "__main__":
              unittest.main()
          PY

          python -m pip install --disable-pip-version-check -q -e . pytest
          set +e
          pytest -q tests/test_sv_numeric_invariants.py
          red_status=$?
          set -e
          if [ "$red_status" -eq 0 ]; then
            echo "SV non-finite regressions unexpectedly passed before the fix" >&2
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          sniffles = Path("src/ontseq_platform/sniffles.py")
          text = sniffles.read_text(encoding="utf-8")
          if "import math\n" not in text:
              text = text.replace("import gzip\n", "import gzip\nimport math\n", 1)

          old = '''    try:\n        return float(first)\n    except ValueError as exc:\n        raise _RejectedRecord(reason) from exc\n'''
          new = '''    try:\n        number = float(first)\n    except ValueError as exc:\n        raise _RejectedRecord(reason) from exc\n    if not math.isfinite(number):\n        raise _RejectedRecord(reason)\n    return number\n'''
          if text.count(old) != 1:
              raise SystemExit("Sniffles optional-float anchor changed unexpectedly")
          text = text.replace(old, new, 1)

          old = '''        if number < 0:\n            raise _RejectedRecord("malformed_coverage")\n        result.append(number)\n'''
          new = '''        if not math.isfinite(number) or number < 0:\n            raise _RejectedRecord("malformed_coverage")\n        result.append(number)\n'''
          if text.count(old) != 1:
              raise SystemExit("Sniffles coverage anchor changed unexpectedly")
          text = text.replace(old, new, 1)

          old = '''    if value < 0:\n        raise _RejectedRecord("malformed_quality")\n    return value\n'''
          new = '''    if not math.isfinite(value) or value < 0:\n        raise _RejectedRecord("malformed_quality")\n    return value\n'''
          if text.count(old) != 1:
              raise SystemExit("Sniffles quality anchor changed unexpectedly")
          sniffles.write_text(text.replace(old, new, 1), encoding="utf-8")

          cutesv = Path("src/ontseq_platform/cutesv.py")
          text = cutesv.read_text(encoding="utf-8")
          if "import math\n" not in text:
              text = text.replace("import gzip\n", "import gzip\nimport math\n", 1)
          old = '''    if value < 0:\n        raise _RejectedRecord("malformed_quality")\n    return value\n'''
          new = '''    if not math.isfinite(value) or value < 0:\n        raise _RejectedRecord("malformed_quality")\n    return value\n'''
          if text.count(old) != 1:
              raise SystemExit("cuteSV quality anchor changed unexpectedly")
          cutesv.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          python -m pip install --disable-pip-version-check -q ruff mypy types-PyYAML types-openpyxl
          ruff format src/ontseq_platform/sniffles.py src/ontseq_platform/cutesv.py tests/test_sv_numeric_invariants.py
          ruff check .
          ruff format --check .
          mypy src
          pytest -q tests/test_sv_numeric_invariants.py tests/test_sniffles.py tests/test_sv_pipeline.py

          rm -f .github/workflows/sv-numeric-repair.yml
          git add -A
          git diff --cached --check
          git commit -m "fix: reject non-finite SV caller evidence"
          git push origin HEAD:fix/sv-nonfinite-numeric-invariants
