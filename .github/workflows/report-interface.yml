name: Offline report interface

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reproducible-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check:build && npm run check:befund && npm test
        working-directory: web
