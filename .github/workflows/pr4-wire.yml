            rm -f .github/workflows/pr4-wire.yml
            { echo "patch_exit=$patch_status"; echo "verify_exit=$verify_status"; echo '--- log tail ---'; tail -n 150 "$LOG"; } > .github/pr4-diagnostic.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'ci: record QC histogram wiring diagnostic'
            git push origin HEAD:${{ github.ref_name }}
          fi
          exit 0
