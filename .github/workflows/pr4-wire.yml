              mypy src &&
              python -m pytest -q
            } >> "$LOG" 2>&1
            verify_status=$?
          fi
          if [ $patch_status -eq 0 ] && [ $verify_status -eq 0 ]; then
            rm .github/workflows/pr4-wire.yml
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
