                  '''  contract or reportability change.

          ### Fixed
          ''',
                  '''  contract or reportability change.
          - Render the QC section's read-length distribution as an inline-SVG histogram fed by the
            normalized Cramino histogram sidecar, with the N50 marker from the normalized QC
