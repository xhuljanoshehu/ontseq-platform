name: One-shot QC histogram wiring

on:
  push:
    branches:
      - feat/report-qc-histogram

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install package with dev tools
        run: python -m pip install -e '.[dev]'
      - name: Patch, verify, commit
        shell: bash
        run: |
          set -uo pipefail
          LOG=/tmp/pr4-wire.log
          python - <<'PYEOF' > "$LOG" 2>&1
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              data = p.read_bytes()
              nl = '\r\n' if b'\r\n' in data else '\n'
              for old_s, new_s in replacements:
                  old = old_s.replace('\n', nl).encode('utf-8')
                  new = new_s.replace('\n', nl).encode('utf-8')
                  if data.count(old) != 1:
                      raise SystemExit(f'{path}: expected 1 match, found {data.count(old)}')
                  data = data.replace(old, new, 1)
              p.write_bytes(data)
              print(f'patched {path}')

          patch('src/ontseq_platform/qc.py', [
              (
                  '''        os.replace(temporary, output_path)
              except BaseException:
                  temporary.unlink(missing_ok=True)
                  raise
              return output_path
          ''',
                  '''        os.replace(temporary, output_path)
              except BaseException:
                  temporary.unlink(missing_ok=True)
                  raise
              return output_path


          def read_length_histogram_from_tsv(text: str) -> list[tuple[int, int | None, int, int]]:
              """Parse the normalized read-length TSV sidecar back into numeric bins.

              The writer above and this reader are the two ends of one format contract, so both
              live in this module and cannot drift apart. Malformed rows fail closed: a report
              must never draw a distribution from partially parsed data.
              """
              bins: list[tuple[int, int | None, int, int]] = []
              lines = text.splitlines()
              if not lines:
                  return bins
              if lines[0] != "start_bp\\tend_bp\\tread_count\\tbase_count":
                  raise ValueError("Read-length histogram sidecar has an unexpected header")
              for line_number, line in enumerate(lines[1:], start=2):
                  fields = line.split("\\t")
                  if len(fields) != 4:
                      raise ValueError(
                          f"Read-length histogram line {line_number} has wrong column count"
                      )
                  try:
                      start = int(fields[0])
                      end = int(fields[1]) if fields[1] else None
                      count = int(fields[2])
                      bases = int(fields[3])
                  except ValueError as exc:
                      raise ValueError(
                          f"Read-length histogram line {line_number} is not numeric"
                      ) from exc
                  if start < 0 or (end is not None and end <= start) or count < 0 or bases < 0:
                      raise ValueError(f"Read-length histogram line {line_number} is out of range")
                  bins.append((start, end, count, bases))
              return bins
          ''',
              ),
          ])

          patch('src/ontseq_platform/report_plots.py', [
              (
                  '''    parts.append(_text(_LEFT, _TOP - 6, "mean depth per target (×)", anchor="start", size=9))
              parts.append("</svg>")
              return "".join(parts)
          ''',
                  '''    parts.append(_text(_LEFT, _TOP - 6, "mean depth per target (×)", anchor="start", size=9))
              parts.append("</svg>")
              return "".join(parts)


          @dataclass(frozen=True)
          class ReadLengthBin:
              """One normalized Cramino read-length bin; ``end=None`` marks the open final bin."""

              start: int
              end: int | None
              count: int
              bases: int


          def read_length_histogram_svg(
              bins: Sequence[ReadLengthBin],
              *,
              title: str,
              n50_bp: int | None = None,
          ) -> str:
              """Render the normalized read-length distribution as an inline-SVG histogram.

              Values come from the Cramino histogram sidecar verbatim. The open final bin
              (no end) is drawn in the soft accent colour so it cannot be mistaken for a
              measured closed bin. An empty input renders as an empty string, so the caller
              omits the figure entirely.
              """
              if not bins:
                  return ""
              for item in bins:
                  if (
                      not isinstance(item.start, int)
                      or isinstance(item.start, bool)
                      or (
                          item.end is not None
                          and (not isinstance(item.end, int) or isinstance(item.end, bool))
                      )
                      or not isinstance(item.count, int)
                      or isinstance(item.count, bool)
                      or not isinstance(item.bases, int)
                      or isinstance(item.bases, bool)
                      or item.start < 0
                      or (item.end is not None and item.end <= item.start)
                      or item.count < 0
                      or item.bases < 0
                  ):
                      raise ValueError("A read-length bin is not numeric/valid")
              ordered = sorted(bins, key=lambda item: (item.start, item.end is None, item.end or 0))
              closed_widths = [item.end - item.start for item in ordered if item.end is not None]
              if not closed_widths:
                  return ""
              open_width = closed_widths[len(closed_widths) // 2]
              spans = [
                  (item.start, item.end if item.end is not None else item.start + open_width, item)
                  for item in ordered
              ]
              x_max = max(end for _, end, _ in spans)
              if x_max <= 0:
                  return ""
              plot_right = _WIDTH - _RIGHT
              plot_bottom = _HEIGHT - 46
              span_y = plot_bottom - _TOP
              y_max = _nice_ceiling(max(item.count for _, _, item in spans))
              if y_max <= 0:
                  return ""

              def x_of(value: float) -> float:
                  return _LEFT + (plot_right - _LEFT) * (value / x_max)

              def y_of(value: float) -> float:
                  return plot_bottom - span_y * (value / y_max)

              parts: list[str] = [
                  f'<svg viewBox="0 0 {_WIDTH} {_HEIGHT}" role="img" '
                  f'aria-label="{html.escape(title)}" xmlns="http://www.w3.org/2000/svg" '
                  f'style="width:100%;height:auto;display:block">',
                  f"<title>{html.escape(title)}</title>",
              ]
              for fraction, label_value in ((0.0, "0"), (0.5, f"{y_max / 2:g}"), (1.0, f"{y_max:g}")):
                  y = plot_bottom - span_y * fraction
                  parts.append(
                      f'<line x1="{_LEFT}" y1="{y:.1f}" x2="{plot_right}" y2="{y:.1f}" '
                      f'stroke="{_GRID}" stroke-width="1"/>'
                  )
                  parts.append(_text(_LEFT - 8, y + 3.5, label_value, anchor="end"))
              if n50_bp is not None and 0 < n50_bp <= x_max:
                  x = x_of(n50_bp)
                  parts.append(
                      f'<line x1="{x:.1f}" y1="{_TOP}" x2="{x:.1f}" y2="{plot_bottom}" '
                      f'stroke="{_REFERENCE}" stroke-width="1" stroke-dasharray="5 4"/>'
                  )
                  parts.append(_text(x + 4, _TOP + 10, "N50", anchor="start", color=_REFERENCE, size=9))
              for start, end, item in spans:
                  x0 = x_of(start)
                  x1 = x_of(end)
                  top = y_of(item.count)
                  end_label = "open" if item.end is None else f"{end:,}"
                  tooltip = (
                      f"{start:,}–{end_label} bp · {item.count:,} reads · "
                      f"{item.bases / 1_000_000:.2f} Mb"
                  )
                  fill = _ACCENT if item.end is not None else _ACCENT_SOFT
                  parts.append(
                      f'<rect x="{x0:.2f}" y="{top:.2f}" width="{max(x1 - x0, 0.5):.2f}" '
                      f'height="{plot_bottom - top:.2f}" fill="{fill}">'
                      f"<title>{tooltip}</title></rect>"
                  )
              for fraction, value in ((0.0, 0), (0.5, x_max // 2), (1.0, x_max)):
                  parts.append(_text(x_of(value), plot_bottom + 16, f"{value / 1000:g} kb", size=9))
              parts.append(_text(_LEFT, _TOP - 6, "reads per length bin", anchor="start", size=9))
              parts.append("</svg>")
              return "".join(parts)
          ''',
              ),
          ])

          patch('src/ontseq_platform/report.py', [
              (
                  '''from __future__ import annotations

          from pathlib import Path
          ''',
                  '''from __future__ import annotations

          from collections.abc import Sequence
          from pathlib import Path
          ''',
              ),
              (
                  '''from .report_formatting import tool_parameters
          ''',
                  '''from .report_formatting import tool_parameters
          from .report_plots import ReadLengthBin, read_length_histogram_svg
          ''',
              ),
              (
                  '''def render_html(
              result: PipelineResult,
              output_path: Path,
              *,
          ''',
                  '''def _qc_histogram_figure(bins: Sequence[ReadLengthBin] | None, view: ReportView) -> str:
              """Read-length distribution from the normalized Cramino histogram sidecar."""
              if not bins:
                  return ""
              n50 = next((value for key, value in view.qc_metrics if key == "n50_bp"), None)
              svg = read_length_histogram_svg(
                  bins,
                  title="Read length distribution",
                  n50_bp=n50 if isinstance(n50, int) and not isinstance(n50, bool) else None,
              )
              if not svg:
                  return ""
              return (
                  "<figure class='plot' style='margin:14px 0'>"
                  + svg
                  + "<figcaption style='color:#5e687a;font-size:12px;margin-top:6px'>Read length "
                  "distribution from the normalized Cramino histogram; the dashed line marks N50. "
                  "Descriptive technical evidence, not an adequacy assessment.</figcaption></figure>"
              )


          def render_html(
              result: PipelineResult,
              output_path: Path,
              *,
          ''',
              ),
              (
                  '''    target_coverage: TargetCoverageReport | None = None,
              selection_coverage: TargetCoverageReport | None = None,
          ) -> Path:
          ''',
                  '''    target_coverage: TargetCoverageReport | None = None,
              selection_coverage: TargetCoverageReport | None = None,
              qc_histogram: Sequence[ReadLengthBin] | None = None,
          ) -> Path:
          ''',
              ),
              (
                  '''    metric_cards = "".join(
                  f"<div><span>{_cell(_metric_name(key))}</span><strong>{_optional(value)}</strong></div>"
                  for key, value in view.qc_metrics
              )
          ''',
                  '''    metric_cards = "".join(
                  f"<div><span>{_cell(_metric_name(key))}</span><strong>{_optional(value)}</strong></div>"
                  for key, value in view.qc_metrics
              )
              qc_histogram_figure = _qc_histogram_figure(qc_histogram, view)
          ''',
              ),
              (
                  '''            <tbody>{_qc_rows(view)}</tbody></table></div>{_failed_gates(view)}
          ''',
                  '''            <tbody>{_qc_rows(view)}</tbody></table></div>{qc_histogram_figure}{_failed_gates(view)}
          ''',
              ),
