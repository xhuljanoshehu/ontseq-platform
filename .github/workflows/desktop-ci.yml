name: Desktop CI

env:
  ONTSEQ_VERSION: "0.4.1"

on:
  pull_request:
    paths:
      - "desktop/**"
      - "src/**"
      - "configs/**"
      - "scripts/run_qdnaseq_ace.R"
      - "workflow/envs/cnv_qdnaseq.yaml"
      - "pyproject.toml"
      - ".github/workflows/desktop-ci.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "src/**"
      - "configs/**"
      - "scripts/run_qdnaseq_ace.R"
      - "workflow/envs/cnv_qdnaseq.yaml"
      - "pyproject.toml"
      - ".github/workflows/desktop-ci.yml"

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: workflow/envs/cnv_qdnaseq.yaml
          # conda-pack must see the original package cache so that hard-coded prefixes in
          # R and compiled Bioconductor packages are rewritten. Restoring only a cached
          # environment makes conda-pack treat those files as unmanaged and can produce a
          # bundle that works only while the build-time prefix still exists.
          cache-environment: false
          cache-downloads: true
      - name: Add packaging tools, ONTSeq package and pinned hg38 annotations
        shell: bash -el {0}
        run: |
          set -euo pipefail
          HG38_COMMIT=cf7c07e39de0ac64a9c38cb030cba4626e2aae83
          micromamba install -y -n ontseq-qdnaseq-cnv -c conda-forge pip conda-pack
          micromamba run -n ontseq-qdnaseq-cnv python -m pip install .
          rm -rf /tmp/QDNAseq.hg38
          git clone --quiet https://github.com/asntech/QDNAseq.hg38.git /tmp/QDNAseq.hg38
          git -C /tmp/QDNAseq.hg38 checkout --quiet "$HG38_COMMIT"
          test "$(git -C /tmp/QDNAseq.hg38 rev-parse HEAD)" = "$HG38_COMMIT"
          micromamba run -n ontseq-qdnaseq-cnv R CMD INSTALL /tmp/QDNAseq.hg38
          micromamba run -n ontseq-qdnaseq-cnv Rscript -e 'stopifnot(as.character(packageVersion("QDNAseq.hg38")) == "1.2.0")'
      - name: Add versioned runtime resources and provenance
        shell: bash -el {0}
        run: |
          set -euo pipefail
          prefix="$(micromamba run -n ontseq-qdnaseq-cnv python -c 'import sys; print(sys.prefix)')"
          mkdir -p "$prefix/share/ontseq"
          cp -a configs "$prefix/share/ontseq/configs"
          mkdir -p "$prefix/share/ontseq/scripts"
          cp scripts/run_qdnaseq_ace.R "$prefix/share/ontseq/scripts/run_qdnaseq_ace.R"
          git rev-parse HEAD > "$prefix/share/ontseq/git-commit.txt"
          printf '%s\n' 'cf7c07e39de0ac64a9c38cb030cba4626e2aae83' > "$prefix/share/ontseq/qdnaseq-hg38-commit.txt"
      - name: Verify complete open-source runtime before packing
        shell: bash -el {0}
        run: |
          set -euo pipefail
          micromamba run -n ontseq-qdnaseq-cnv python -c 'import ontseq_platform; assert ontseq_platform.__version__ == "${{ env.ONTSEQ_VERSION }}", ontseq_platform.__version__'
          micromamba run -n ontseq-qdnaseq-cnv samtools --version | head -1
          micromamba run -n ontseq-qdnaseq-cnv cramino --version
          micromamba run -n ontseq-qdnaseq-cnv sniffles --version
          micromamba run -n ontseq-qdnaseq-cnv mosdepth --version
          micromamba run -n ontseq-qdnaseq-cnv Rscript - <<'RS'
          stopifnot(as.character(packageVersion("QDNAseq")) == "1.42.0")
          stopifnot(as.character(packageVersion("QDNAseq.hg19")) == "1.36.0")
          stopifnot(as.character(packageVersion("QDNAseq.hg38")) == "1.2.0")
          stopifnot(as.character(packageVersion("ACE")) == "1.24.0")
          for (size in c(100, 500, 1000)) {
            bins <- QDNAseq::getBinAnnotations(binSize = size, genome = "hg38")
            stopifnot(nrow(Biobase::pData(bins)) > 0)
          }
          RS
          micromamba run -n ontseq-qdnaseq-cnv ontseq run --help | grep -q -- '--cnv-policy'
          micromamba run -n ontseq-qdnaseq-cnv ontseq run --help | grep -q -- '--target-coverage-policy'
          micromamba run -n ontseq-qdnaseq-cnv ontseq run --help | grep -q -- '--components'
          micromamba run -n ontseq-qdnaseq-cnv ontseq serve --help | grep -q -- '--target-coverage-policy'
          micromamba run -n ontseq-qdnaseq-cnv ontseq serve --help | grep -q -- '--components'
          micromamba run -n ontseq-qdnaseq-cnv ontseq validate-reference --help >/dev/null
          micromamba run -n ontseq-qdnaseq-cnv ontseq system-smoke --help | grep -q -- '--qdnaseq-script'
      - name: Pack relocatable Linux runtime
        shell: bash -el {0}
        run: |
          set -euo pipefail
          prefix="$(micromamba run -n ontseq-qdnaseq-cnv python -c 'import sys; print(sys.prefix)')"
          micromamba run -n ontseq-qdnaseq-cnv conda-pack -p "$prefix" -o ontseq-linux-runtime.tar.gz 2>&1 | tee /tmp/conda-pack.log
          if grep -q 'Uncached packages:' /tmp/conda-pack.log; then
            echo 'conda-pack could not safely relocate every managed package' >&2
            exit 1
          fi
          test -s ontseq-linux-runtime.tar.gz
      - name: Prove packed runtime works after relocation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ontseq-packed
          tar -xzf ontseq-linux-runtime.tar.gz -C /tmp/ontseq-packed
          PATH="/tmp/ontseq-packed/bin:$PATH" /tmp/ontseq-packed/bin/conda-unpack
          test -f /tmp/ontseq-packed/share/ontseq/configs/qc/defaults.yaml
          test -f /tmp/ontseq-packed/share/ontseq/configs/qc/adaptive_target_coverage.technical.yaml
          test -f /tmp/ontseq-packed/share/ontseq/configs/components/default.yaml
          test -f /tmp/ontseq-packed/share/ontseq/configs/sv/sniffles2.conservative.technical.yaml
          test -f /tmp/ontseq-packed/share/ontseq/configs/cnv/qdnaseq_ace.technical.yaml
          test -f /tmp/ontseq-packed/share/ontseq/scripts/run_qdnaseq_ace.R
          test "$(wc -c < /tmp/ontseq-packed/share/ontseq/git-commit.txt)" -ge 40
          grep -qx 'cf7c07e39de0ac64a9c38cb030cba4626e2aae83' /tmp/ontseq-packed/share/ontseq/qdnaseq-hg38-commit.txt
          PATH="/tmp/ontseq-packed/bin:$PATH" /tmp/ontseq-packed/bin/ontseq --help >/dev/null
          PATH="/tmp/ontseq-packed/bin:$PATH" /tmp/ontseq-packed/bin/ontseq validate-reference --help >/dev/null
          PATH="/tmp/ontseq-packed/bin:$PATH" /tmp/ontseq-packed/bin/ontseq serve --help | grep -q -- '--target-coverage-policy'
          PATH="/tmp/ontseq-packed/bin:$PATH" /tmp/ontseq-packed/bin/ontseq serve --help | grep -q -- '--components'
          PATH="/tmp/ontseq-packed/bin:$PATH" /tmp/ontseq-packed/bin/Rscript - <<'RS'
          stopifnot(requireNamespace("QDNAseq", quietly = TRUE))
          stopifnot(requireNamespace("QDNAseq.hg19", quietly = TRUE))
          stopifnot(requireNamespace("QDNAseq.hg38", quietly = TRUE))
          stopifnot(requireNamespace("ACE", quietly = TRUE))
          stopifnot(as.character(packageVersion("QDNAseq.hg38")) == "1.2.0")
          for (size in c(100, 500, 1000)) {
            bins <- QDNAseq::getBinAnnotations(binSize = size, genome = "hg38")
            stopifnot(nrow(Biobase::pData(bins)) > 0)
          }
          RS
          PATH="/tmp/ontseq-packed/bin:$PATH" /tmp/ontseq-packed/bin/ontseq local-smoke \
            --output-dir /tmp/ontseq-packed-smoke \
            --qc-policy /tmp/ontseq-packed/share/ontseq/configs/qc/defaults.yaml \
            --sniffles-policy /tmp/ontseq-packed/share/ontseq/configs/sv/sniffles2.conservative.technical.yaml
          test -s /tmp/ontseq-packed-smoke/local-smoke.report.json
      - name: Prove full system smoke on stock Ubuntu without host Python or R
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/ontseq-linux-runtime.tar.gz:/runtime.tar.gz:ro" \
            ubuntu:24.04 \
            bash -lc '
              set -euo pipefail
              if command -v python >/dev/null 2>&1 || command -v Rscript >/dev/null 2>&1; then
                echo "stock-image invariant violated: Python or R unexpectedly present" >&2
                exit 1
              fi
              mkdir -p /opt/ontseq
              tar -xzf /runtime.tar.gz -C /opt/ontseq
              RUNTIME_PATH="/opt/ontseq/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
              env PATH="$RUNTIME_PATH" /opt/ontseq/bin/conda-unpack
              env PATH="$RUNTIME_PATH" /opt/ontseq/bin/ontseq --help >/dev/null
              env PATH="$RUNTIME_PATH" /opt/ontseq/bin/Rscript --version
              grep -qx "cf7c07e39de0ac64a9c38cb030cba4626e2aae83" /opt/ontseq/share/ontseq/qdnaseq-hg38-commit.txt
              env PATH="$RUNTIME_PATH" /opt/ontseq/bin/Rscript -e "stopifnot(requireNamespace(\"QDNAseq\",quietly=TRUE), requireNamespace(\"QDNAseq.hg19\",quietly=TRUE), requireNamespace(\"QDNAseq.hg38\",quietly=TRUE), requireNamespace(\"ACE\",quietly=TRUE), as.character(packageVersion(\"QDNAseq.hg38\")) == \"1.2.0\"); for (s in c(100,500,1000)) stopifnot(nrow(Biobase::pData(QDNAseq::getBinAnnotations(binSize=s, genome=\"hg38\"))) > 0)"

              set +e
              env PATH="$RUNTIME_PATH" /opt/ontseq/bin/ontseq system-smoke \
                --output-dir /tmp/ontseq-system-smoke \
                --qc-policy /opt/ontseq/share/ontseq/configs/qc/defaults.yaml \
                --sniffles-policy /opt/ontseq/share/ontseq/configs/sv/sniffles2.conservative.technical.yaml \
                --cnv-policy /opt/ontseq/share/ontseq/configs/cnv/qdnaseq_ace.technical.yaml \
                --qdnaseq-rscript /opt/ontseq/bin/Rscript \
                --qdnaseq-script /opt/ontseq/share/ontseq/scripts/run_qdnaseq_ace.R \
                --samtools /opt/ontseq/bin/samtools \
                --cramino /opt/ontseq/bin/cramino \
                --sniffles /opt/ontseq/bin/sniffles \
                --threads 2
              smoke_status=$?
              set -e

              report=/tmp/ontseq-system-smoke/system-smoke.report.json
              root=/tmp/ontseq-system-smoke/runs/SYSTEM_CNV_SMOKE_RUN_001/SYSTEM_CNV_SMOKE_001
              qdnaseq="$root/evidence/cnv/SYSTEM_CNV_SMOKE_001.qdnaseq.json"
              if test "$smoke_status" -ne 0; then
                echo "system-smoke failed with exit code $smoke_status; preserving compact diagnostics" >&2
                if test -s "$report"; then
                  echo "--- system-smoke report ---" >&2
                  env PATH="$RUNTIME_PATH" /opt/ontseq/bin/jq . "$report" >&2 || true
                fi
                if test -s "$qdnaseq"; then
                  echo "--- QDNAseq/ACE chr7/chr8 diagnostics ---" >&2
                  env PATH="$RUNTIME_PATH" /opt/ontseq/bin/jq "{status, primary_fit, fits, chromosome_consensus: [.chromosome_consensus[] | select(.chromosome==\"chr7\" or .chromosome==\"chr8\")], events: [.events[] | select(.primary.chromosome==\"chr7\" or .primary.chromosome==\"chr8\")], warnings, limitations}" "$qdnaseq" >&2 || true
                fi
                exit "$smoke_status"
              fi

              test -s "$report"
              verdict="$(env PATH="$RUNTIME_PATH" /opt/ontseq/bin/jq -r .verdict "$report")"
              test "$verdict" = "PASS"
              echo "system-smoke verdict: $verdict"
              test -s "$qdnaseq"
              test -s "$root/reports/SYSTEM_CNV_SMOKE_001.report.html"
              test -s "$root/reports/SYSTEM_CNV_SMOKE_001.results.xlsx"
              echo "verifying release checksums independently with GNU sha256sum"
              cd "$root"
              sha256sum -c release/checksums.sha256
              echo "stock Ubuntu full system smoke: PASS"
            '
      - name: Upload Linux runtime
        uses: actions/upload-artifact@v4
        with:
          name: ontseq-linux-runtime-v${{ env.ONTSEQ_VERSION }}
          path: ontseq-linux-runtime.tar.gz
          if-no-files-found: error
          retention-days: 30

  windows-desktop:
    needs: linux-runtime
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build WPF shell
        run: dotnet build desktop/ONTSeq.Desktop/ONTSeq.Desktop.csproj -c Release
      - name: Test BAM index and reference identity handling
        run: dotnet run --project desktop/ONTSeq.Desktop.Tests/ONTSeq.Desktop.Tests.csproj -c Release
      - name: Publish self-contained win-x64 executable
        run: >-
          dotnet publish desktop/ONTSeq.Desktop/ONTSeq.Desktop.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -o desktop/publish
      - name: Add pinned Linux runtime to desktop bundle
        uses: actions/download-artifact@v4
        with:
          name: ontseq-linux-runtime-v${{ env.ONTSEQ_VERSION }}
          path: desktop/publish/runtime
      - name: Add operator documentation and build identity
        shell: pwsh
        run: |
          Copy-Item desktop/README-FIRST-RUN.md desktop/publish/README-FIRST-RUN.md
          Copy-Item desktop/README.md desktop/publish/README.md
          Copy-Item desktop/ONTSeq.Desktop/CHANGELOG.md desktop/publish/CHANGELOG.md
          $commit = (git rev-parse HEAD).Trim()
          @"
          ONTSeq Desktop ${{ env.ONTSEQ_VERSION }}-engineering
          Core ${{ env.ONTSEQ_VERSION }}
          Git commit: $commit
          Platform: win-x64 self-contained WPF + bundled Linux/R WSL runtime
          Build type: unsigned Research Use Only engineering bundle
          Artifact: ontseq-desktop-v${{ env.ONTSEQ_VERSION }}-win-x64-setup-engineering
          GRCh38 QDNAseq annotation: QDNAseq.hg38 1.2.0 @ cf7c07e39de0ac64a9c38cb030cba4626e2aae83
          "@ | Set-Content -Encoding utf8 desktop/publish/BUILD-INFO.txt
      - name: Verify complete first-run bundle
        shell: pwsh
        run: |
          $exe = "desktop/publish/ONTSeq.Desktop.exe"
          $runtime = "desktop/publish/runtime/ontseq-linux-runtime.tar.gz"
          $buildInfo = "desktop/publish/BUILD-INFO.txt"
          $firstRun = "desktop/publish/README-FIRST-RUN.md"
          $readme = "desktop/publish/README.md"
          $changelog = "desktop/publish/CHANGELOG.md"
          foreach ($path in @($exe, $runtime, $buildInfo, $firstRun, $readme, $changelog)) {
            if (-not (Test-Path $path)) { throw "Required bundle file is missing: $path" }
          }
          $expectedCommit = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $embeddedCommit = (& tar -xOf $runtime share/ontseq/git-commit.txt).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0) { throw "Could not read embedded runtime git commit" }
          if ($embeddedCommit -ne $expectedCommit) {
            throw "Bundled runtime commit $embeddedCommit does not match desktop build $expectedCommit"
          }
          $hg38Commit = (& tar -xOf $runtime share/ontseq/qdnaseq-hg38-commit.txt).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0) { throw "Could not read embedded QDNAseq.hg38 source commit" }
          if ($hg38Commit -ne "cf7c07e39de0ac64a9c38cb030cba4626e2aae83") {
            throw "Bundled QDNAseq.hg38 commit is unexpected: $hg38Commit"
          }
          if (-not (Select-String -Path $buildInfo -SimpleMatch "ONTSeq Desktop ${{ env.ONTSEQ_VERSION }}-engineering" -Quiet)) {
            throw "BUILD-INFO.txt does not identify Desktop v${{ env.ONTSEQ_VERSION }}"
          }
          if (-not (Select-String -Path $firstRun -SimpleMatch "Desktop v${{ env.ONTSEQ_VERSION }}" -Quiet)) {
            throw "First-run documentation is not versioned for v${{ env.ONTSEQ_VERSION }}"
          }
          Get-Item $exe,$runtime,$buildInfo,$firstRun,$readme,$changelog | Select-Object Name,Length,LastWriteTime
      - name: Upload unsigned setup engineering artifact
        uses: actions/upload-artifact@v4
        with:
          name: ontseq-desktop-v${{ env.ONTSEQ_VERSION }}-win-x64-setup-engineering
          path: desktop/publish/
          if-no-files-found: error
          retention-days: 30
