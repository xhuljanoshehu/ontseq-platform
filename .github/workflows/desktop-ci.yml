name: Desktop CI

on:
  pull_request:
    paths:
      - "desktop/**"
      - "src/**"
      - "configs/**"
      - "scripts/run_qdnaseq_ace.R"
      - "workflow/envs/cnv_qdnaseq.yaml"
      - "pyproject.toml"
      - ".github/workflows/desktop-ci.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "src/**"
      - "configs/**"
      - "scripts/run_qdnaseq_ace.R"
      - "workflow/envs/cnv_qdnaseq.yaml"
      - "pyproject.toml"
      - ".github/workflows/desktop-ci.yml"

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: workflow/envs/cnv_qdnaseq.yaml
          # conda-pack must see the original package cache so that hard-coded prefixes in
          # R and compiled Bioconductor packages are rewritten. Restoring only a cached
          # environment makes conda-pack treat those files as unmanaged and can produce a
          # bundle that works only while the build-time prefix still exists.
          cache-environment: false
          cache-downloads: true
      - name: Add packaging tools and ONTSeq package
        shell: bash -el {0}
        run: |
          set -euo pipefail
          micromamba install -y -n ontseq-qdnaseq-cnv -c conda-forge pip conda-pack
          micromamba run -n ontseq-qdnaseq-cnv python -m pip install .
      - name: Add versioned runtime resources
        shell: bash -el {0}
        run: |
          set -euo pipefail
          prefix="$(micromamba run -n ontseq-qdnaseq-cnv python -c 'import sys; print(sys.prefix)')"
          mkdir -p "$prefix/share/ontseq"
          cp -a configs "$prefix/share/ontseq/configs"
          mkdir -p "$prefix/share/ontseq/scripts"
          cp scripts/run_qdnaseq_ace.R "$prefix/share/ontseq/scripts/run_qdnaseq_ace.R"
      - name: Verify complete open-source runtime before packing
        shell: bash -el {0}
        run: |
          set -euo pipefail
          micromamba run -n ontseq-qdnaseq-cnv samtools --version | head -1
          micromamba run -n ontseq-qdnaseq-cnv cramino --version
          micromamba run -n ontseq-qdnaseq-cnv sniffles --version
          micromamba run -n ontseq-qdnaseq-cnv Rscript -e 'cat("R=",R.version.string,"\n",sep=""); cat("QDNAseq=",as.character(packageVersion("QDNAseq")),"\n",sep=""); cat("QDNAseq.hg19=",as.character(packageVersion("QDNAseq.hg19")),"\n",sep=""); cat("ACE=",as.character(packageVersion("ACE")),"\n",sep="")'
          micromamba run -n ontseq-qdnaseq-cnv ontseq run --help | grep -q -- '--cnv-policy'
      - name: Pack relocatable Linux runtime
        shell: bash -el {0}
        run: |
          set -euo pipefail
          prefix="$(micromamba run -n ontseq-qdnaseq-cnv python -c 'import sys; print(sys.prefix)')"
          micromamba run -n ontseq-qdnaseq-cnv conda-pack -p "$prefix" -o ontseq-linux-runtime.tar.gz 2>&1 | tee /tmp/conda-pack.log
          if grep -q 'Uncached packages:' /tmp/conda-pack.log; then
            echo 'conda-pack could not safely relocate every managed package' >&2
            exit 1
          fi
          test -s ontseq-linux-runtime.tar.gz
      - name: Prove packed runtime works after relocation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ontseq-packed
          tar -xzf ontseq-linux-runtime.tar.gz -C /tmp/ontseq-packed
          PATH="/tmp/ontseq-packed/bin:$PATH" /tmp/ontseq-packed/bin/conda-unpack
          test -f /tmp/ontseq-packed/share/ontseq/configs/qc/defaults.yaml
          test -f /tmp/ontseq-packed/share/ontseq/configs/sv/sniffles2.conservative.technical.yaml
          test -f /tmp/ontseq-packed/share/ontseq/configs/cnv/qdnaseq_ace.technical.yaml
          test -f /tmp/ontseq-packed/share/ontseq/scripts/run_qdnaseq_ace.R
          PATH="/tmp/ontseq-packed/bin:$PATH" /tmp/ontseq-packed/bin/ontseq --help >/dev/null
          PATH="/tmp/ontseq-packed/bin:$PATH" /tmp/ontseq-packed/bin/Rscript -e 'stopifnot(requireNamespace("QDNAseq",quietly=TRUE), requireNamespace("QDNAseq.hg19",quietly=TRUE), requireNamespace("ACE",quietly=TRUE))'
          PATH="/tmp/ontseq-packed/bin:$PATH" /tmp/ontseq-packed/bin/ontseq local-smoke \
            --output-dir /tmp/ontseq-packed-smoke \
            --qc-policy /tmp/ontseq-packed/share/ontseq/configs/qc/defaults.yaml \
            --sniffles-policy /tmp/ontseq-packed/share/ontseq/configs/sv/sniffles2.conservative.technical.yaml
          test -d /tmp/ontseq-packed-smoke
      - name: Prove first bootstrap on stock Ubuntu without host Python or R
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/ontseq-linux-runtime.tar.gz:/runtime.tar.gz:ro" \
            ubuntu:24.04 \
            bash -lc '
              set -euo pipefail
              if command -v python >/dev/null 2>&1 || command -v Rscript >/dev/null 2>&1; then
                echo "stock-image invariant violated: Python or R unexpectedly present" >&2
                exit 1
              fi
              mkdir -p /opt/ontseq
              tar -xzf /runtime.tar.gz -C /opt/ontseq
              RUNTIME_PATH="/opt/ontseq/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
              env PATH="$RUNTIME_PATH" /opt/ontseq/bin/conda-unpack
              env PATH="$RUNTIME_PATH" /opt/ontseq/bin/ontseq --help >/dev/null
              env PATH="$RUNTIME_PATH" /opt/ontseq/bin/Rscript --version
              env PATH="$RUNTIME_PATH" /opt/ontseq/bin/Rscript -e "stopifnot(requireNamespace(\"QDNAseq\",quietly=TRUE), requireNamespace(\"QDNAseq.hg19\",quietly=TRUE), requireNamespace(\"ACE\",quietly=TRUE))"
              env PATH="$RUNTIME_PATH" /opt/ontseq/bin/ontseq local-smoke \
                --output-dir /tmp/ontseq-smoke \
                --qc-policy /opt/ontseq/share/ontseq/configs/qc/defaults.yaml \
                --sniffles-policy /opt/ontseq/share/ontseq/configs/sv/sniffles2.conservative.technical.yaml
              test -d /tmp/ontseq-smoke
            '
      - name: Upload Linux runtime
        uses: actions/upload-artifact@v4
        with:
          name: ontseq-linux-runtime
          path: ontseq-linux-runtime.tar.gz
          if-no-files-found: error
          retention-days: 30

  windows-desktop:
    needs: linux-runtime
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build WPF shell
        run: dotnet build desktop/ONTSeq.Desktop/ONTSeq.Desktop.csproj -c Release
      - name: Test BAM index detection
        run: dotnet run --project desktop/ONTSeq.Desktop.Tests/ONTSeq.Desktop.Tests.csproj -c Release
      - name: Publish self-contained win-x64 executable
        run: >-
          dotnet publish desktop/ONTSeq.Desktop/ONTSeq.Desktop.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -o desktop/publish
      - name: Add pinned Linux runtime to desktop bundle
        uses: actions/download-artifact@v4
        with:
          name: ontseq-linux-runtime
          path: desktop/publish/runtime
      - name: Verify complete first-run bundle
        shell: pwsh
        run: |
          $exe = "desktop/publish/ONTSeq.Desktop.exe"
          $runtime = "desktop/publish/runtime/ontseq-linux-runtime.tar.gz"
          if (-not (Test-Path $exe)) { throw "Desktop executable was not published" }
          if (-not (Test-Path $runtime)) { throw "Bundled Linux runtime is missing" }
          Get-Item $exe,$runtime | Select-Object Name,Length,LastWriteTime
      - name: Upload unsigned setup engineering artifact
        uses: actions/upload-artifact@v4
        with:
          name: ontseq-desktop-v0.2-win-x64-setup-engineering
          path: desktop/publish/
          if-no-files-found: error
          retention-days: 30
