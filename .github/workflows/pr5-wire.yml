name: One-shot CNV genome overview wiring

on:
  push:
    branches:
      - feat/report-cnv-genome-plot

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install package with dev tools
        run: python -m pip install -e '.[dev]'
      - name: Patch, verify, commit
        shell: bash
        run: |
          set -uo pipefail
          LOG=/tmp/pr5-wire.log
          python .github/pr5_patch.py > "$LOG" 2>&1
          patch_status=$?
          verify_status=0
          if [ $patch_status -eq 0 ]; then
            {
              ruff check --fix . &&
              ruff format src/ontseq_platform/report_plots.py src/ontseq_platform/cnv/extension.py tests/test_report_plots.py &&
              ruff check . &&
              ruff format --check . &&
              mypy src &&
              python -m pytest -q
            } >> "$LOG" 2>&1
            verify_status=$?
          fi
          if [ $patch_status -eq 0 ] && [ $verify_status -eq 0 ]; then
            rm -f .github/workflows/pr5-wire.yml .github/pr5_patch.py .github/pr5-diagnostic.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git diff --cached --check
            git commit -m 'feat(report): render genome-wide CNV overview as inline SVG'
            git push origin HEAD:${{ github.ref_name }}
          else
            git checkout -- .
            rm -f .github/workflows/pr5-wire.yml
            { echo "patch_exit=$patch_status"; echo "verify_exit=$verify_status"; echo '--- log tail ---'; tail -n 150 "$LOG"; } > .github/pr5-diagnostic.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'ci: record CNV genome overview wiring diagnostic'
            git push origin HEAD:${{ github.ref_name }}
          fi
          exit 0
