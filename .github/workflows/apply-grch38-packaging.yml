name: Apply GRCh38 packaging integration

on:
  pull_request:
    paths:
      - ".github/workflows/apply-grch38-packaging.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Patch Desktop packaging and operator docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          pin = "cf7c07e39de0ac64a9c38cb030cba4626e2aae83"
          wf = Path(".github/workflows/desktop-ci.yml")
          text = wf.read_text(encoding="utf-8").replace("0.3.4", "0.3.5")

          anchor = "          micromamba run -n ontseq-qdnaseq-cnv python -m pip install .\n"
          insert = anchor + (
              "          rm -rf /tmp/QDNAseq.hg38\n"
              "          git clone --quiet https://github.com/asntech/QDNAseq.hg38.git /tmp/QDNAseq.hg38\n"
              f"          git -C /tmp/QDNAseq.hg38 checkout --quiet {pin}\n"
              f"          test \"$(git -C /tmp/QDNAseq.hg38 rev-parse HEAD)\" = \"{pin}\"\n"
              "          micromamba run -n ontseq-qdnaseq-cnv R CMD INSTALL /tmp/QDNAseq.hg38\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit(f"pip-install anchor count={text.count(anchor)}")
          text = text.replace(anchor, insert)

          anchor = '          git rev-parse HEAD > "$prefix/share/ontseq/git-commit.txt"\n'
          insert = anchor + f"          printf '%s\\n' '{pin}' > \"$prefix/share/ontseq/qdnaseq-hg38-commit.txt\"\n"
          if text.count(anchor) != 1:
              raise SystemExit(f"provenance anchor count={text.count(anchor)}")
          text = text.replace(anchor, insert)

          old = '          micromamba run -n ontseq-qdnaseq-cnv Rscript -e \'cat("R=",R.version.string,"\\n",sep=""); cat("QDNAseq=",as.character(packageVersion("QDNAseq")),"\\n",sep=""); cat("QDNAseq.hg19=",as.character(packageVersion("QDNAseq.hg19")),"\\n",sep=""); cat("ACE=",as.character(packageVersion("ACE")),"\\n",sep="")\'\n'
          new = '          micromamba run -n ontseq-qdnaseq-cnv Rscript -e \'cat("R=",R.version.string,"\\n",sep=""); cat("QDNAseq=",as.character(packageVersion("QDNAseq")),"\\n",sep=""); cat("QDNAseq.hg19=",as.character(packageVersion("QDNAseq.hg19")),"\\n",sep=""); cat("QDNAseq.hg38=",as.character(packageVersion("QDNAseq.hg38")),"\\n",sep=""); cat("ACE=",as.character(packageVersion("ACE")),"\\n",sep=""); stopifnot(as.character(packageVersion("QDNAseq")) == "1.42.0", as.character(packageVersion("QDNAseq.hg19")) == "1.36.0", as.character(packageVersion("QDNAseq.hg38")) == "1.2.0", as.character(packageVersion("ACE")) == "1.24.0")\'\n'
          if text.count(old) != 1:
              raise SystemExit(f"prepack R anchor count={text.count(old)}")
          text = text.replace(old, new)

          anchor = '          test "$(wc -c < /tmp/ontseq-packed/share/ontseq/git-commit.txt)" -ge 40\n'
          insert = anchor + f"          grep -qx '{pin}' /tmp/ontseq-packed/share/ontseq/qdnaseq-hg38-commit.txt\n"
          if text.count(anchor) != 1:
              raise SystemExit(f"packed pin anchor count={text.count(anchor)}")
          text = text.replace(anchor, insert)

          old = '          PATH="/tmp/ontseq-packed/bin:$PATH" /tmp/ontseq-packed/bin/Rscript -e \'stopifnot(requireNamespace("QDNAseq",quietly=TRUE), requireNamespace("QDNAseq.hg19",quietly=TRUE), requireNamespace("ACE",quietly=TRUE))\'\n'
          new = '          PATH="/tmp/ontseq-packed/bin:$PATH" /tmp/ontseq-packed/bin/Rscript -e \'stopifnot(requireNamespace("QDNAseq",quietly=TRUE), requireNamespace("QDNAseq.hg19",quietly=TRUE), requireNamespace("QDNAseq.hg38",quietly=TRUE), requireNamespace("ACE",quietly=TRUE), as.character(packageVersion("QDNAseq.hg38")) == "1.2.0"); for (s in c(100,500,1000)) stopifnot(nrow(Biobase::pData(QDNAseq::getBinAnnotations(binSize=s, genome="hg38"))) > 0)\'\n'
          if text.count(old) != 1:
              raise SystemExit(f"relocated R anchor count={text.count(old)}")
          text = text.replace(old, new)

          old = '              env PATH="$RUNTIME_PATH" /opt/ontseq/bin/Rscript -e "stopifnot(requireNamespace(\\"QDNAseq\\",quietly=TRUE), requireNamespace(\\"QDNAseq.hg19\\",quietly=TRUE), requireNamespace(\\"ACE\\",quietly=TRUE))"\n'
          new = f'              grep -qx \'{pin}\' /opt/ontseq/share/ontseq/qdnaseq-hg38-commit.txt\n' + '              env PATH="$RUNTIME_PATH" /opt/ontseq/bin/Rscript -e "stopifnot(requireNamespace(\\"QDNAseq\\",quietly=TRUE), requireNamespace(\\"QDNAseq.hg19\\",quietly=TRUE), requireNamespace(\\"QDNAseq.hg38\\",quietly=TRUE), requireNamespace(\\"ACE\\",quietly=TRUE), as.character(packageVersion(\\"QDNAseq.hg38\\")) == \\"1.2.0\\"); for (s in c(100,500,1000)) stopifnot(nrow(Biobase::pData(QDNAseq::getBinAnnotations(binSize=s, genome=\\"hg38\\"))) > 0)"\n'
          if text.count(old) != 1:
              raise SystemExit(f"stock R anchor count={text.count(old)}")
          text = text.replace(old, new)
          wf.write_text(text, encoding="utf-8")

          readme = Path("desktop/README.md")
          text = readme.read_text(encoding="utf-8").replace("v0.3.4", "v0.3.5").replace("0.3.4", "0.3.5")
          old = "The bundled reproducible QDNAseq environment currently includes the Bioconductor `QDNAseq.hg19` annotation package. Therefore a GRCh37 desktop run requests the integrated QDNAseq + ACE CNV stage using 100/500/1000 kbp views, a 500-kbp primary view and multi-bin consensus.\n\nGRCh38 runs continue through the other requested modules but do **not** request QDNAseq CNV until the hg38 annotation resource has its own pinned, real-tool-tested packaging path. This is deliberate fail-closed behavior: absence of GRCh38 CNV output is not evidence of normal copy number.\n"
          new = f"The bundled reproducible QDNAseq environment includes `QDNAseq.hg19` 1.36.0 for GRCh37 and the open-source `QDNAseq.hg38` 1.2.0 data package pinned to upstream commit `{pin}` for GRCh38. Desktop runs on either build request the integrated QDNAseq + ACE CNV stage using 100/500/1000 kbp views, a 500-kbp primary view and multi-bin consensus.\n\nThe GRCh38 lane was enabled only after a canonical real-tool test recovered a deterministic synthetic chromosome 7 loss (CN~1) and chromosome 8 gain (CN~3), produced HTML/XLSX/JSON outputs, verified release checksums and resumed content-addressed on an unchanged rerun. This is engineering verification, not cohort-level analytical or clinical validation.\n"
          if text.count(old) != 1:
              raise SystemExit(f"README CNV paragraph count={text.count(old)}")
          text = text.replace(old, new)
          text = text.replace(
              "- GRCh38 QDNAseq annotation packaging and real-tool test;\n",
              "- analytical validation of both GRCh37 and GRCh38 CNV on controlled real/reference samples;\n",
          )
          readme.write_text(text, encoding="utf-8")
          PY

          git rm .github/workflows/apply-grch38-packaging.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/desktop-ci.yml desktop/README.md
          git commit -m "Desktop 0.3.5: package pinned GRCh38 CNV annotations"
          git push origin HEAD:${{ github.head_ref }}
