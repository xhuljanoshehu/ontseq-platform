name: Apply GRCh38 packaging integration

on:
  pull_request:
    paths:
      - ".github/workflows/apply-grch38-packaging.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Patch Desktop packaging
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          pin = "cf7c07e39de0ac64a9c38cb030cba4626e2aae83"
          wf = Path(".github/workflows/desktop-ci.yml")
          text = wf.read_text(encoding="utf-8").replace("0.3.4", "0.3.5")

          anchor = "          micromamba run -n ontseq-qdnaseq-cnv python -m pip install .\n"
          if text.count(anchor) != 1:
              raise SystemExit(f"pip anchor={text.count(anchor)}")
          text = text.replace(
              anchor,
              anchor
              + "          rm -rf /tmp/QDNAseq.hg38\n"
              + "          git clone --quiet https://github.com/asntech/QDNAseq.hg38.git /tmp/QDNAseq.hg38\n"
              + f"          git -C /tmp/QDNAseq.hg38 checkout --quiet {pin}\n"
              + f"          test \"$(git -C /tmp/QDNAseq.hg38 rev-parse HEAD)\" = \"{pin}\"\n"
              + "          micromamba run -n ontseq-qdnaseq-cnv R CMD INSTALL /tmp/QDNAseq.hg38\n",
          )

          anchor = '          git rev-parse HEAD > "$prefix/share/ontseq/git-commit.txt"\n'
          if text.count(anchor) != 1:
              raise SystemExit(f"git provenance anchor={text.count(anchor)}")
          text = text.replace(
              anchor,
              anchor + f"          printf '%s\\n' '{pin}' > \"$prefix/share/ontseq/qdnaseq-hg38-commit.txt\"\n",
          )

          old = 'cat("QDNAseq.hg19=",as.character(packageVersion("QDNAseq.hg19")),"\\n",sep=""); cat("ACE=",as.character(packageVersion("ACE")),"\\n",sep="")'
          new = 'cat("QDNAseq.hg19=",as.character(packageVersion("QDNAseq.hg19")),"\\n",sep=""); cat("QDNAseq.hg38=",as.character(packageVersion("QDNAseq.hg38")),"\\n",sep=""); cat("ACE=",as.character(packageVersion("ACE")),"\\n",sep=""); stopifnot(as.character(packageVersion("QDNAseq")) == "1.42.0", as.character(packageVersion("QDNAseq.hg19")) == "1.36.0", as.character(packageVersion("QDNAseq.hg38")) == "1.2.0", as.character(packageVersion("ACE")) == "1.24.0")'
          if text.count(old) != 1:
              raise SystemExit(f"prepack R fragment={text.count(old)}")
          text = text.replace(old, new)

          anchor = '          test "$(wc -c < /tmp/ontseq-packed/share/ontseq/git-commit.txt)" -ge 40\n'
          if text.count(anchor) != 1:
              raise SystemExit(f"packed commit anchor={text.count(anchor)}")
          text = text.replace(
              anchor,
              anchor + f"          grep -qx '{pin}' /tmp/ontseq-packed/share/ontseq/qdnaseq-hg38-commit.txt\n",
          )

          old = 'requireNamespace("QDNAseq.hg19",quietly=TRUE), requireNamespace("ACE",quietly=TRUE)'
          new = 'requireNamespace("QDNAseq.hg19",quietly=TRUE), requireNamespace("QDNAseq.hg38",quietly=TRUE), requireNamespace("ACE",quietly=TRUE), as.character(packageVersion("QDNAseq.hg38")) == "1.2.0"'
          occurrences = text.count(old)
          if occurrences < 1:
              raise SystemExit("no runtime R verification fragment")
          text = text.replace(old, new)

          packed_r_line = '          PATH="/tmp/ontseq-packed/bin:$PATH" /tmp/ontseq-packed/bin/Rscript -e '
          pos = text.find(packed_r_line)
          if pos < 0:
              raise SystemExit("packed R line not found")
          line_end = text.find("\n", pos)
          line = text[pos:line_end]
          if 'getBinAnnotations' not in line:
              replacement = line[:-1] + '; for (s in c(100,500,1000)) stopifnot(nrow(Biobase::pData(QDNAseq::getBinAnnotations(binSize=s, genome="hg38"))) > 0)\'"
              # Keep the YAML line syntactically simple by rebuilding it directly.
              replacement = '          PATH="/tmp/ontseq-packed/bin:$PATH" /tmp/ontseq-packed/bin/Rscript -e \'stopifnot(requireNamespace("QDNAseq",quietly=TRUE), requireNamespace("QDNAseq.hg19",quietly=TRUE), requireNamespace("QDNAseq.hg38",quietly=TRUE), requireNamespace("ACE",quietly=TRUE), as.character(packageVersion("QDNAseq.hg38")) == "1.2.0"); for (s in c(100,500,1000)) stopifnot(nrow(Biobase::pData(QDNAseq::getBinAnnotations(binSize=s, genome="hg38"))) > 0)\''
              text = text[:pos] + replacement + text[line_end:]

          wf.write_text(text, encoding="utf-8")
          PY

          git rm .github/workflows/apply-grch38-packaging.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/desktop-ci.yml
          git commit -m "Desktop 0.3.5: package pinned GRCh38 annotations"
          git push origin HEAD:${{ github.head_ref }}
