name: CNV Spectre depth-only real-tool

on:
  pull_request:
    paths:
      - "src/ontseq_platform/cnv/spectre.py"
      - "configs/cnv/spectre.depth-only.technical.yaml"
      - "workflow/envs/spectre_depth_only.yaml"
      - "tests/test_spectre_runtime.py"
      - "tests/test_spectre_real_tool.py"
      - ".github/workflows/cnv-spectre.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spectre-depth-only-real-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: workflow/envs/spectre_depth_only.yaml
          cache-environment: true
          post-cleanup: all

      - name: Verify the pinned Spectre runtime
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          spectre version 2>&1 | tee /tmp/spectre-version.log
          grep -q 'Spectre version: 0\.2\.1' /tmp/spectre-version.log
          python - <<'PY'
          from importlib.metadata import version

          assert version("spectre-cnv") == "0.2.1"
          PY

      - name: Run depth-only contract and synthetic real-tool smoke
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          ONTSEQ_SPECTRE_REAL_TOOL=1 PYTHONPATH=src \
            python -m pytest -q tests/test_spectre_runtime.py tests/test_spectre_real_tool.py
