name: CNV block 3 final schema once

on:
  push:
    branches:
      - feat/cnv-validation-program
    paths:
      - ".github/workflows/cnv-block3-final-schema-once.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/cnv-validation-program
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install ONTSeq
        run: python -m pip install -e .
      - name: Generate schemas
        run: python scripts/export_schemas.py
      - name: Commit final Block 3 report schema only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/cnv-validation-report.schema.json
          if git diff --cached --quiet; then
            echo "CNV validation report schema already current."
          else
            git commit -m "schema(cnv): freeze exact metric provenance report"
            git push origin HEAD:feat/cnv-validation-program
          fi
