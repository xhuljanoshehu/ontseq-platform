name: Desktop Format Temporary

on:
  push:
    branches:
      - feat/ontseq-desktop-v0.1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ontseq-desktop-v0.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install "ruff==0.16.3"
      - name: Format desktop files
        run: |
          ruff check --fix \
            packaging/desktop_launcher.py \
            src/ontseq_platform/desktop \
            tests/test_desktop.py
          ruff format \
            packaging/desktop_launcher.py \
            src/ontseq_platform/desktop \
            tests/test_desktop.py
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/desktop_launcher.py src/ontseq_platform/desktop tests/test_desktop.py
          git commit -m "style(desktop): apply ruff formatting"
          git push origin HEAD:feat/ontseq-desktop-v0.1
