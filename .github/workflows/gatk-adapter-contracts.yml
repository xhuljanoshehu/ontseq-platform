name: GATK adapter contracts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/ontseq_platform/gatk*.py'
      - 'src/ontseq_platform/gatk_adapter/**'
      - 'tests/test_gatk*.py'
      - 'schemas/gatk_adapter/**'
      - 'docs/gatk_adapter/**'
      - '.github/workflows/gatk-adapter-contracts.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install engineering tools only
        run: python -m pip install -e '.[dev]'
      - name: Synthetic adapter tests, not a real GATK run
        run: python -m pytest tests/test_gatk_mutect2.py tests/test_gatk_adapter.py tests/test_gatk_as_filter_status.py
      - name: Lint both adapter implementations
        if: ${{ !cancelled() }}
        run: ruff check src/ontseq_platform/gatk*.py src/ontseq_platform/gatk_adapter tests/test_gatk*.py
      - name: Enforce adapter formatting
        if: ${{ !cancelled() }}
        run: ruff format --check src/ontseq_platform/gatk*.py src/ontseq_platform/gatk_adapter tests/test_gatk*.py
      - name: Check both adapter contracts
        if: ${{ !cancelled() }}
        run: mypy src/ontseq_platform/gatk_mutect2.py src/ontseq_platform/gatk_vcf.py src/ontseq_platform/gatk_adapter
