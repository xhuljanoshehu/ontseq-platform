name: Authorized merge repair verification
on:
  push:
    branches: [chore/merge-repair-20260920]
    paths:
      - .github/workflows/merge-repair-verify.yml
      - scripts/authorized_merge_repair.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pr: [78, 81, 82]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare only reviewed conflicts on a detached PR checkout
        env:
          PR_NUMBER: ${{ matrix.pr }}
        run: |
          set -euo pipefail
          cp scripts/authorized_merge_repair.py "$RUNNER_TEMP/authorized_merge_repair.py"
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'authorized_merge_repair.py'
          text = p.read_text()
          changes = {
              'set((matches[0][1] + matches[0][2]).splitlines()) != expected': '{line.strip() for line in (matches[0][1] + matches[0][2]).splitlines()} != {line.strip() for line in expected}',
              '        assert json.loads(exported[Path(f"schemas/{name}.schema.json")]) == model.model_json_schema()': '        exported_schema = json.loads(exported[Path(f"schemas/{name}.schema.json")])\n        assert exported_schema == model.model_json_schema()',
              'run("git", "diff", "--cached", "--check")': 'run("git", "diff", "--cached", "--check", BASE, "--", ":!*.md")',
          }
          for old, new in changes.items():
              assert text.count(old) == 1, old
              text = text.replace(old, new)
          p.write_text(text)
          PY
          git config user.name 'ONTSeq merge repair'
          git config user.email 'merge-repair@users.noreply.github.com'
          python "$RUNNER_TEMP/authorized_merge_repair.py" prepare "$PR_NUMBER"
      - name: Install repository test dependencies
        run: python -m pip install -q -e '.[dev,workflow]' pysam
      - name: Verify new schema regression RED to GREEN and commit repair
        env:
          PR_NUMBER: ${{ matrix.pr }}
        run: python "$RUNNER_TEMP/authorized_merge_repair.py" finalize "$PR_NUMBER"
      - name: Validate safety versions schemas style types and full regression
        run: |
          set -euo pipefail
          python scripts/check_repository_safety.py
          python scripts/check_version_consistency.py
          python scripts/export_schemas.py --check
          ruff check .
          ruff format --check .
          mypy src
          python -m pytest --junitxml=results/merge-repair-pytest.xml
          snakemake --snakefile workflow/benchmark.smk --dry-run --cores 1
          snakemake --snakefile workflow/aligned_bam.smk --dry-run --cores 4
          python -m ontseq_platform demo --output-dir results/merge-repair-demo
          python -m pip wheel --no-deps --wheel-dir /tmp/ontseq-repair-wheel .
          python scripts/check_wheel_resources.py /tmp/ontseq-repair-wheel/ontseq_platform-*.whl
      - uses: mamba-org/setup-micromamba@v3
        if: matrix.pr == 82
        with:
          environment-file: workflow/envs/severus_1_7.yaml
          cache-environment: true
          post-cleanup: all
      - name: Verify both real Severus synthetic smoke tests
        if: matrix.pr == 82
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          ONTSEQ_SEVERUS_REAL_TOOL=1 PYTHONPATH=src python -m pytest -q tests/test_severus_runtime.py tests/test_severus_real_tool.py tests/test_severus_long_read_real_tool.py
      - name: Fast-forward only the original PR branch after successful tests
        env:
          PR_NUMBER: ${{ matrix.pr }}
        run: python "$RUNNER_TEMP/authorized_merge_repair.py" promote "$PR_NUMBER"
  combined:
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Rehearse the complete merge stack without modifying main
        run: |
          set -euo pipefail
          git config user.name 'ONTSeq merge repair'
          git config user.email 'merge-repair@users.noreply.github.com'
          git checkout --detach ceaab08079b8cb7c528eac6f6137ad2e4dac5f31
          git merge --no-edit --no-ff origin/feat/marlin-dual-runtime-compatibility
          git merge --no-edit --no-ff origin/feat/multicaller-routing
          git merge --no-edit --no-ff origin/feat/multicaller-real-tool-qualification
          git log -4 --oneline
          git diff --check ceaab08079b8cb7c528eac6f6137ad2e4dac5f31 HEAD -- ':!*.md'
      - name: Verify the entire combined source tree
        run: |
          set -euo pipefail
          python -m pip install -q -e '.[dev,workflow]' pysam
          python scripts/check_repository_safety.py
          python scripts/check_version_consistency.py
          python scripts/export_schemas.py --check
          ruff check .
          ruff format --check .
          mypy src
          python -m pytest --junitxml=results/combined-merge-pytest.xml
          snakemake --snakefile workflow/benchmark.smk --dry-run --cores 1
          snakemake --snakefile workflow/aligned_bam.smk --dry-run --cores 4
          python -m ontseq_platform demo --output-dir results/combined-merge-demo
          python -m pip wheel --no-deps --wheel-dir /tmp/ontseq-combined-wheel .
          python scripts/check_wheel_resources.py /tmp/ontseq-combined-wheel/ontseq_platform-*.whl
          git rev-parse HEAD^{tree}
