name: CNV schema refresh

on:
  push:
    branches:
      - feat/cnv-validation-program
    paths:
      - "src/ontseq_platform/cnv_validation_contracts.py"
      - "src/ontseq_platform/cnv_validation_registration.py"
      - "scripts/export_schemas.py"
      - ".github/workflows/cnv-schema-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Generate schemas
        run: python scripts/export_schemas.py
      - name: Commit generated CNV schemas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            schemas/cnv-validation-matrix.schema.json \
            schemas/cnv-validation-cohort.schema.json \
            schemas/cnv-validation-registration.schema.json
          if git diff --cached --quiet; then
            echo "CNV validation schemas already current."
          else
            git commit -m "chore(cnv): refresh validation schemas"
            git push origin HEAD:feat/cnv-validation-program
          fi
