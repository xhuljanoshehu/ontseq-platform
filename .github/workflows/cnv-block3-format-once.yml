name: CNV block 3 format once

on:
  push:
    branches:
      - feat/cnv-validation-program
    paths:
      - ".github/workflows/cnv-block3-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/cnv-validation-program
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install "ruff==0.15.6"
      - name: Format Block 3 files
        run: |
          ruff format \
            src/ontseq_platform/cnv_validation_metrics.py \
            tests/test_cnv_validation_metrics.py
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ontseq_platform/cnv_validation_metrics.py \
            tests/test_cnv_validation_metrics.py
          if git diff --cached --quiet; then
            echo "Block 3 files already formatted."
          else
            git commit -m "style(cnv): canonicalize exact metric provenance"
            git push origin HEAD:feat/cnv-validation-program
          fi
