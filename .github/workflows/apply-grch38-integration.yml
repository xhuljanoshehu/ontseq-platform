name: Apply GRCh38 Desktop integration

on:
  pull_request:
    paths:
      - ".github/workflows/apply-grch38-integration.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Enable GRCh38 CNV in Desktop source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          service = Path("src/ontseq_platform/service/app.py")
          text = service.read_text(encoding="utf-8")
          pattern = re.compile(
              r"    modules = \[AnalysisModule\.QC, AnalysisModule\.SV, AnalysisModule\.ISCN, AnalysisModule\.REPORT\]\n"
              r"    # The bundled real-tool QDNAseq runtime currently carries the hg19 annotation package\.\n"
              r"    # GRCh38 remains usable for the other modules; CNV is added only when its annotation\n"
              r"    # package is actually present in the tested desktop runtime\.\n"
              r"    if genome_build == GenomeBuild\.GRCH37:\n"
              r"        modules\.insert\(1, AnalysisModule\.CNV\)\n"
          )
          replacement = (
              "    modules = [\n"
              "        AnalysisModule.QC,\n"
              "        AnalysisModule.CNV,\n"
              "        AnalysisModule.SV,\n"
              "        AnalysisModule.ISCN,\n"
              "        AnalysisModule.REPORT,\n"
              "    ]\n"
          )
          text, n = pattern.subn(replacement, text)
          if n != 1:
              raise SystemExit(f"service manifest replacement count={n}")
          pattern = re.compile(
              r"            lock = load_model\(config\.reference_lock, ReferenceLock\)\n"
              r"            not_wired = \[\"basecalling — not needed for an already aligned BAM\"\]\n"
              r"            if lock\.genome_build != GenomeBuild\.GRCH37:\n"
              r"                not_wired\.append\(\n"
              r"                    \"cnv — bundled QDNAseq annotations are currently available for GRCh37 only\"\n"
              r"                \)\n"
          )
          text, n = pattern.subn(
              '            not_wired = ["basecalling — not needed for an already aligned BAM"]\n',
              text,
          )
          if n != 1:
              raise SystemExit(f"service config replacement count={n}")
          service.write_text(text, encoding="utf-8")

          launcher = Path("desktop/ONTSeq.Desktop/WslServiceLauncher.cs")
          text = launcher.read_text(encoding="utf-8")
          text = text.replace("v0.3.4", "v0.3.5").replace("0.3.4", "0.3.5")
          old = "requireNamespace('QDNAseq.hg19',quietly=TRUE), requireNamespace('ACE',quietly=TRUE)"
          new = "requireNamespace('QDNAseq.hg19',quietly=TRUE), requireNamespace('QDNAseq.hg38',quietly=TRUE), requireNamespace('ACE',quietly=TRUE)"
          if text.count(old) != 1:
              raise SystemExit(f"launcher QDNAseq package replacement count={text.count(old)}")
          text = text.replace(old, new)
          launcher.write_text(text, encoding="utf-8")
          PY

          git rm .github/workflows/apply-grch38-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ontseq_platform/service/app.py desktop/ONTSeq.Desktop/WslServiceLauncher.cs
          git commit -m "Desktop 0.3.5: enable GRCh38 CNV selection"
          git push origin HEAD:${{ github.head_ref }}
