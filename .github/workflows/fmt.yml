name: One-shot formatter normalization

on:
  push:
    branches:
      - feat/report-cnv-genome-plot

permissions:
  contents: write

jobs:
  fmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install package with dev tools
        run: python -m pip install -e '.[dev]'
      - name: Normalize lint and formatting, commit, self-remove
        shell: bash
        run: |
          set -uo pipefail
          ruff check --fix .
          lint_status=$?
          ruff format .
          format_status=$?
          rm -f .github/workflows/fmt.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "no changes needed; lint=$lint_status format=$format_status"
          else
            git diff --cached --check
            git commit -m "style: normalize with repo-pinned ruff (lint=$lint_status format=$format_status)"
            git push origin HEAD:${{ github.ref_name }}
          fi
          exit 0
