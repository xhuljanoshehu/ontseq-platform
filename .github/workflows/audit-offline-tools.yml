name: Offline audit tools
on:
  push:
    branches: [fix/audit-20260909]
    paths: [.github/workflows/audit-offline-tools.yml]
permissions:
  contents: read
jobs:
  wheelhouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: |
          python -m pip download --only-binary=:all: --dest /tmp/audit-wheelhouse ruff mypy types-openpyxl types-PyYAML hypothesis pysam
      - uses: actions/upload-artifact@v7
        with:
          name: audit-offline-tools-py313
          path: /tmp/audit-wheelhouse/
          retention-days: 2
          if-no-files-found: error
