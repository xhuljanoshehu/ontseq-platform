name: One-shot lint and test diagnostic

on:
  push:
    branches:
      - feat/report-cnv-genome-plot

permissions:
  contents: write

jobs:
  diag:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install package with dev tools
        run: python -m pip install -e '.[dev,workflow]' pysam
      - name: Capture lint, type check and test output
        shell: bash
        run: |
          {
            echo '=== ruff check . ==='
            ruff check . || true
            echo '=== ruff format --check . ==='
            ruff format --check . || true
            echo '=== mypy src ==='
            mypy src || true
            echo '=== pytest tests/test_report_plots.py ==='
            python -m pytest tests/test_report_plots.py -q || true
            echo '=== pytest full suite ==='
            python -m pytest -q || true
          } > .github/pr73-lint-report.txt 2>&1
          rm -f .github/workflows/diag.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: capture PR 73 lint/test diagnostic'
          git push origin HEAD:${{ github.ref_name }}
          exit 0
