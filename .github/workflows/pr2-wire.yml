name: One-shot desktop stage timeline

on:
  push:
    branches:
      - feat/desktop-stage-timeline

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Patch, verify, commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:RUNNER_TEMP 'pr2-wire.log'
          @'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              data = p.read_bytes()
              nl = '\r\n' if b'\r\n' in data else '\n'
              for old_s, new_s in replacements:
                  old = old_s.replace('\n', nl).encode('utf-8')
                  new = new_s.replace('\n', nl).encode('utf-8')
                  if data.count(old) != 1:
                      raise SystemExit(f'{path}: expected 1 match, found {data.count(old)}')
                  data = data.replace(old, new, 1)
              p.write_bytes(data)
              print(f'patched {path}')

          patch('desktop/ONTSeq.Desktop/Models.cs', [
              (
                  '''using System.Text.Json;
          using System.Text.Json.Serialization;
          ''',
                  '''using System.Text.Json;
          using System.Text.Json.Serialization;
          using System.Windows.Media;
          ''',
              ),
              (
                  '''public sealed record StageDisplay(string Title, string Status, string Reason)
          {
              public string Symbol => Status switch
              {
                  "COMPLETED" => "✓",
                  "NO_CALL" => "○",
                  "FAILED" => "✕",
                  "NOT_RUN" => "—",
                  "RUNNING" => "●",
                  _ => "○"
              };
          }
          ''',
                  '''public sealed record StageDisplay(string Title, string Status, string Reason)
          {
              // Timeline colors mirror the portable report's status semantics: NO_CALL stays
              // neutral amber, NOT_RUN neutral gray; only FAILED is red, and a stage that has
              // not reported yet stays hollow.
              private static readonly Brush CompletedBrush = FrozenBrush("#2E7D5B");
              private static readonly Brush NoCallBrush = FrozenBrush("#B26A00");
              private static readonly Brush FailedBrush = FrozenBrush("#B3261E");
              private static readonly Brush NotRunBrush = FrozenBrush("#8A93A3");
              private static readonly Brush RunningBrush = FrozenBrush("#174A6E");
              private static readonly Brush PendingBrush = FrozenBrush("#9AA4B2");

              public string Symbol => Status switch
              {
                  "COMPLETED" => "✓",
                  "NO_CALL" => "○",
                  "FAILED" => "✕",
                  "NOT_RUN" => "—",
                  "RUNNING" => "●",
                  _ => "○"
              };

              public Brush DotFill => Status switch
              {
                  "COMPLETED" => CompletedBrush,
                  "NO_CALL" => NoCallBrush,
                  "FAILED" => FailedBrush,
                  "NOT_RUN" => NotRunBrush,
                  "RUNNING" => RunningBrush,
                  _ => Brushes.White
              };

              public Brush DotStroke => Status is "COMPLETED" or "NO_CALL" or "FAILED" or "NOT_RUN" or "RUNNING"
                  ? DotFill
                  : PendingBrush;

              public string StatusCaption => Status switch
              {
                  "COMPLETED" => "abgeschlossen",
                  "NO_CALL" => "kein verwertbarer Call",
                  "FAILED" => "fehlgeschlagen",
                  "NOT_RUN" => "nicht gelaufen",
                  "RUNNING" => "läuft",
                  _ => "ausstehend"
              };

              public string NodeToolTip => string.IsNullOrWhiteSpace(Reason)
                  ? $"{Title} · {StatusCaption}"
                  : $"{Title} · {StatusCaption}: {Reason}";

              private static Brush FrozenBrush(string hex)
              {
                  var brush = (SolidColorBrush)new BrushConverter().ConvertFromInvariantString(hex)!;
                  brush.Freeze();
                  return brush;
              }
          }
          ''',
              ),
          ])

          patch('desktop/ONTSeq.Desktop/MainWindow.xaml', [
              (
                  '''                <Grid.RowDefinitions>
                              <RowDefinition Height="Auto" />
                              <RowDefinition Height="Auto" />
                              <RowDefinition Height="*" />
                          </Grid.RowDefinitions>
                          <Grid Grid.Row="0" Margin="0,0,0,12">
          ''',
                  '''                <Grid.RowDefinitions>
                              <RowDefinition Height="Auto" />
                              <RowDefinition Height="Auto" />
                              <RowDefinition Height="Auto" />
                              <RowDefinition Height="*" />
                          </Grid.RowDefinitions>
                          <Grid Grid.Row="0" Margin="0,0,0,12">
          ''',
              ),
              (
                  '''                <ProgressBar Grid.Row="1" x:Name="RunProgress" Height="7" Minimum="0" Maximum="100" Value="0" Margin="0,0,0,14" />
                          <ScrollViewer Grid.Row="2" VerticalScrollBarVisibility="Auto">
          ''',
                  '''                <ProgressBar Grid.Row="1" x:Name="RunProgress" Height="7" Minimum="0" Maximum="100" Value="0" Margin="0,0,0,14" />
                          <Border Grid.Row="2" Background="#F7F9FC" BorderBrush="#E1E6EE" BorderThickness="1"
                                  CornerRadius="6" Padding="10,8" Margin="0,0,0,12"
                                  ToolTip="Stage-Verlauf des Laufs. NO_CALL (kein verwertbarer Call) und NOT_RUN (nicht gelaufen) sind keine Fehler.">
                              <ScrollViewer HorizontalScrollBarVisibility="Auto" VerticalScrollBarVisibility="Disabled">
                                  <ItemsControl ItemsSource="{Binding StageItems}">
                                      <ItemsControl.ItemsPanel>
                                          <ItemsPanelTemplate>
                                              <StackPanel Orientation="Horizontal" />
                                          </ItemsPanelTemplate>
                                      </ItemsControl.ItemsPanel>
                                      <ItemsControl.ItemTemplate>
                                          <DataTemplate>
                                              <Grid Width="112">
                                                  <Grid.RowDefinitions>
                                                      <RowDefinition Height="16" />
                                                      <RowDefinition Height="Auto" />
                                                      <RowDefinition Height="Auto" />
                                                  </Grid.RowDefinitions>
                                                  <Border Grid.Row="0" Height="2" Background="#D3DAE4" VerticalAlignment="Center" />
                                                  <Ellipse Grid.Row="0" Width="13" Height="13" HorizontalAlignment="Center"
                                                           Fill="{Binding DotFill}" Stroke="{Binding DotStroke}" StrokeThickness="1.5"
                                                           ToolTip="{Binding NodeToolTip}" />
                                                  <TextBlock Grid.Row="1" Text="{Binding Title}" FontSize="11" FontWeight="SemiBold"
                                                             Foreground="#33405A" TextAlignment="Center" TextWrapping="Wrap"
                                                             TextTrimming="CharacterEllipsis" MaxHeight="32" Margin="2,3,2,0"
                                                             ToolTip="{Binding NodeToolTip}" />
                                                  <TextBlock Grid.Row="2" Text="{Binding StatusCaption}" FontSize="10"
                                                             Foreground="#758294" TextAlignment="Center" />
                                              </Grid>
                                          </DataTemplate>
                                      </ItemsControl.ItemTemplate>
                                  </ItemsControl>
                              </ScrollViewer>
                          </Border>
                          <ScrollViewer Grid.Row="3" VerticalScrollBarVisibility="Auto">
          ''',
              ),
          ])

          patch('desktop/ONTSeq.Desktop/CHANGELOG.md', [
              (
                  '''## Unreleased

          - Default new resource installations
          ''',
                  '''## Unreleased

          - Show run progress additionally as a horizontal stage timeline in the Desktop panel:
            one node per stage with German status caption and tooltip. NO_CALL stays neutral
            amber, NOT_RUN neutral gray, only FAILED is red, and stages without a report yet
            stay hollow. Presentation only; stage semantics, provenance and backend status are
            unchanged.
          - Default new resource installations
          ''',
              ),
          ])
          '@ | python - *>&1 | Tee-Object -FilePath $log
          $patchExit = $LASTEXITCODE
          $buildExit = 999
          $testExit = 999
          if ($patchExit -eq 0) {
            & dotnet build desktop/ONTSeq.Desktop/ONTSeq.Desktop.csproj -c Release *>&1 |
              Tee-Object -FilePath $log -Append
            $buildExit = $LASTEXITCODE
          }
          if ($buildExit -eq 0) {
            & dotnet run --project desktop/ONTSeq.Desktop.Tests/ONTSeq.Desktop.Tests.csproj -c Release *>&1 |
              Tee-Object -FilePath $log -Append
            $testExit = $LASTEXITCODE
          }
          if ($patchExit -eq 0 -and $buildExit -eq 0 -and $testExit -eq 0) {
            Remove-Item '.github/workflows/pr2-wire.yml'
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git diff --cached --check
            git commit -m 'feat(desktop): show run stages as a status timeline'
            git push origin HEAD:${{ github.ref_name }}
          }
          else {
            git checkout -- .
            Remove-Item '.github/workflows/pr2-wire.yml' -ErrorAction SilentlyContinue
            @("patch_exit=$patchExit", "build_exit=$buildExit", "test_exit=$testExit", '--- log tail ---') |
              Set-Content -Encoding utf8 '.github/pr2-diagnostic.txt'
            Get-Content $log -Tail 200 | Add-Content -Encoding utf8 '.github/pr2-diagnostic.txt'
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'ci: record desktop timeline wiring diagnostic'
            git push origin HEAD:${{ github.ref_name }}
          }
          exit 0
