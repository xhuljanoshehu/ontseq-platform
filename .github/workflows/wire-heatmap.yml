name: One-shot heatmap wiring

on:
  push:
    branches:
      - feat/report-methylation-heatmap

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply remaining call-site patches
        run: |
          python .github/heatmap_wire.py
          rm -f .github/heatmap_wire.py .github/workflows/wire-heatmap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'feat(report): wire methylation heatmap into both report paths'
          git push origin HEAD:${{ github.ref_name }}
