name: Authorized merge repair completion
on:
  push:
    branches: [chore/merge-repair-20260920]
    paths: [.github/workflows/merge-repair-complete.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair82:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare PR 82 with connector-authorized workflow already committed
        run: |
          set -euo pipefail
          cp scripts/authorized_merge_repair.py "$RUNNER_TEMP/authorized_merge_repair.py"
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'authorized_merge_repair.py'
          text = p.read_text()
          text = text.replace('30521bebc67f2562c26120a8f32983dfaaaad0d7', 'a5c27f33c8e611a22bc42469fc5498b72e8b0766')
          text = text.replace('run("git", "diff", "--cached", "--check")', 'run("git", "diff", "--cached", "--check", BASE, "--", ":!*.md")')
          p.write_text(text)
          PY
          git config user.name 'ONTSeq merge repair'
          git config user.email 'merge-repair@users.noreply.github.com'
          python "$RUNNER_TEMP/authorized_merge_repair.py" prepare 82
          git show a5c27f33c8e611a22bc42469fc5498b72e8b0766:.github/workflows/sv-severus.yml > .github/workflows/sv-severus.yml
          python "$RUNNER_TEMP/authorized_merge_repair.py" finalize 82
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Validate repaired source before promoting branch
        run: |
          set -euo pipefail
          python -m pip install -q -e '.[dev,workflow]' pysam
          python scripts/check_repository_safety.py
          python scripts/check_version_consistency.py
          python scripts/export_schemas.py --check
          ruff check .
          ruff format --check .
          mypy src
          python -m pytest --junitxml=results/merge-repair-pytest.xml
          snakemake --snakefile workflow/benchmark.smk --dry-run --cores 1
          snakemake --snakefile workflow/aligned_bam.smk --dry-run --cores 4
          python -m ontseq_platform demo --output-dir results/merge-repair-demo
          python -m pip wheel --no-deps --wheel-dir /tmp/ontseq-repair-wheel .
          python scripts/check_wheel_resources.py /tmp/ontseq-repair-wheel/ontseq_platform-*.whl
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: workflow/envs/severus_1_7.yaml
          cache-environment: true
          post-cleanup: all
      - name: Verify both real Severus synthetic smoke tests
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          ONTSEQ_SEVERUS_REAL_TOOL=1 PYTHONPATH=src python -m pytest -q tests/test_severus_runtime.py tests/test_severus_real_tool.py tests/test_severus_long_read_real_tool.py
      - name: Fast-forward the original PR 82 branch only after all checks pass
        run: python "$RUNNER_TEMP/authorized_merge_repair.py" promote 82
  combined:
    needs: repair82
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Rehearse all three authorized merges without changing main
        run: |
          set -euo pipefail
          git config user.name 'ONTSeq merge repair'
          git config user.email 'merge-repair@users.noreply.github.com'
          test "$(git rev-parse origin/main)" = ceaab08079b8cb7c528eac6f6137ad2e4dac5f31
          test "$(git rev-parse origin/feat/marlin-dual-runtime-compatibility)" = aaa4d099cef0c0fdec19df1e7b95e92ea3ad6f68
          test "$(git rev-parse origin/feat/multicaller-routing)" = f3ddbb74dee031dc739fe23467fb4bbdf913bc0a
          git checkout --detach ceaab08079b8cb7c528eac6f6137ad2e4dac5f31
          git merge --no-edit --no-ff origin/feat/marlin-dual-runtime-compatibility
          git merge --no-edit --no-ff origin/feat/multicaller-routing
          git merge --no-edit --no-ff origin/feat/multicaller-real-tool-qualification
          git log -4 --oneline
          git diff --check ceaab08079b8cb7c528eac6f6137ad2e4dac5f31 HEAD -- ':!*.md'
      - name: Verify the entire combined source tree
        run: |
          set -euo pipefail
          python -m pip install -q -e '.[dev,workflow]' pysam
          python scripts/check_repository_safety.py
          python scripts/check_version_consistency.py
          python scripts/export_schemas.py --check
          ruff check .
          ruff format --check .
          mypy src
          python -m pytest --junitxml=results/combined-merge-pytest.xml
          snakemake --snakefile workflow/benchmark.smk --dry-run --cores 1
          snakemake --snakefile workflow/aligned_bam.smk --dry-run --cores 4
          python -m ontseq_platform demo --output-dir results/combined-merge-demo
          python -m pip wheel --no-deps --wheel-dir /tmp/ontseq-combined-wheel .
          python scripts/check_wheel_resources.py /tmp/ontseq-combined-wheel/ontseq_platform-*.whl
          echo 'VERIFIED COMBINED TREE'
          git rev-parse HEAD^{tree}
