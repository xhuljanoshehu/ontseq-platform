name: Tumor SAVANA real-tool

on:
  pull_request:
    paths:
      - "src/ontseq_platform/tumor/savana.py"
      - "src/ontseq_platform/tumor_inputs.py"
      - "configs/tumor/savana.*.technical.yaml"
      - "workflow/envs/savana_1_3_8.yaml"
      - "tests/test_savana_runtime.py"
      - "tests/test_savana_real_tool.py"
      - ".github/workflows/tumor-savana.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  savana-real-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: workflow/envs/savana_1_3_8.yaml
          cache-environment: true
          post-cleanup: all

      - name: Verify the pinned SAVANA runtime
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          savana --version 2>&1 | tee /tmp/savana-version.log
          grep -Eq '1\.3\.8' /tmp/savana-version.log
          python - <<'PY'
          from importlib.metadata import version

          assert version("savana") == "1.3.8"
          PY

      - name: Run SAVANA adapter contracts and synthetic real-tool smoke
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          ONTSEQ_SAVANA_REAL_TOOL=1 PYTHONPATH=src \
            python -m pytest -q tests/test_savana_runtime.py tests/test_savana_real_tool.py
