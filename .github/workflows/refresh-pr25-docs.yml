name: Refresh PR 25 implementation status

on:
  push:
    branches:
      - design/interactive-review-workspace-v1

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Reconcile design documents with implemented features
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one match in {path}: {old[:80]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          workspace = Path("docs/INTERACTIVE_REVIEW_WORKSPACE.md")
          replace_once(
              workspace,
              "**Non-goal:** this document does not promote any caller, threshold, fusion, CNV, ISCN or other result to clinical reportability.\n",
              "**Non-goal:** this document does not promote any caller, threshold, fusion, CNV, ISCN or other result to clinical reportability.\n\n> **Implementation update, 2026-09-12:** The portable report now has a typed review-view layer, explicit module-state strip, target-coverage plot, read-length histogram, CNV genome plot and methylation heatmap. Those shipped static/offline surfaces implement part of Phase V1. The linked local evidence workspace, read-level browser and reviewer audit layer remain proposals.\n",
          )

          matrix = Path("docs/VISUALIZATION_DATA_MATRIX.md")
          replace_once(
              matrix,
              "**Rule:** a visualization may only render a datum that is present in a versioned normalized contract or an explicitly identified generated artifact. Missing information is displayed as unavailable; it is never reconstructed from presentation files or inferred from visual context.\n",
              "**Rule:** a visualization may only render a datum that is present in a versioned normalized contract or an explicitly identified generated artifact. Missing information is displayed as unavailable; it is never reconstructed from presentation files or inferred from visual context.\n\n> **Implementation update, 2026-09-12:** ONTSeq now retains a normalized Cramino read-length histogram sidecar and renders deterministic inline-SVG read-length, target-coverage, CNV-genome and methylation heatmap figures in the offline HTML report. The report also uses a typed review-view layer and explicit module-state semantics. Interactive linked selection, evidence inspectors and read-level browsing remain future work.\n",
          )
          replace_once(
              matrix,
              "### Current gap\n\nThe present canonical Cramino normalization stores aggregate metrics, not the full read-length histogram. Therefore the modernized report must not fabricate a read-length histogram from N50/mean/median alone. A histogram becomes available only if the pipeline intentionally retains and normalizes an appropriate distribution artifact.\n",
              "### Implemented read-length distribution\n\nThe pipeline intentionally retains a normalized Cramino read-length histogram sidecar and the portable report renders it as deterministic inline SVG. N50 is shown only as a marker on that measured distribution; the renderer never reconstructs a histogram from N50, mean or median. Missing/empty sidecars omit the figure rather than fabricating evidence.\n",
          )
          replace_once(
              matrix,
              "## 14. First implementation backlog, ordered by value/risk\n\n1. Introduce a report view-model layer so presentation stops reaching directly into `PipelineResult` everywhere.\n2. Add a reviewer state strip with exact module semantics.\n3. Add CNV fit and chromosome-consensus sections from the existing QDNAseq/ACE contract.\n4. Add target-coverage matrix/distribution from `TargetCoverageReport` when present.\n5. Expand SV evidence columns to expose available support/VAF/coverage/precision without inference.\n6. Add evidence inspector/cross-selection in the portable HTML using local-only JS.\n7. Add build-aware chromosome/segment visualization.\n8. Perform JBrowse 2 versus IGV.js technical spike for local BAM/VCF review.\n9. Add loopback-only evidence service and lazy read-level viewer.\n10. Only after the above: reviewer annotation/audit UX.\n\nThis ordering deliberately extracts more value from data ONTSeq already produces before adding new biological inference.",
              "## 14. Implementation backlog and status (updated 2026-09-12)\n\n1. **Implemented:** typed report view-model layer separates reviewer presentation from scientific contracts.\n2. **Implemented:** reviewer state strip preserves `COMPLETED`, `NO_CALL`, `FAILED` and `NOT_RUN`.\n3. **Partly implemented:** static CNV chromosome-consensus genome plot is shipped; an interactive fit explorer remains pending.\n4. **Partly implemented:** target-coverage tables and deterministic depth plot are shipped; linked matrix/distribution interactions remain pending.\n5. **Implemented:** portable-report SV evidence exposes support reads, local coverage, VAF, quality, strands, precision and filters without inference.\n6. **Pending:** evidence inspector and cross-selection in the portable/local workspace.\n7. **Partly implemented:** build-aware cytoband annotation and static chromosome summaries exist; interactive linked segment visualization remains pending.\n8. **Pending:** bounded JBrowse 2 versus IGV.js technical spike for local BAM/VCF review.\n9. **Pending:** loopback-only evidence service and lazy read-level viewer.\n10. **Pending:** reviewer annotation/audit UX after the evidence workspace is validated.\n\nThe shipped items are presentation of existing normalized evidence only. They do not establish analytical or clinical validation.",
          )

          technology = Path("docs/VISUALIZATION_TECHNOLOGY_EVALUATION.md")
          replace_once(
              technology,
              "**Decision scope:** visualization/rendering only; no scientific caller or reportability decisions.\n",
              "**Decision scope:** visualization/rendering only; no scientific caller or reportability decisions.\n\n> **Implementation update, 2026-09-12:** The portable report now uses semantic HTML and deterministic pure-Python inline SVG for read-length, coverage, CNV and methylation views, backed by normalized artifacts and a typed review-view layer. No heavy frontend dependency has been adopted. JBrowse 2, IGV.js, Gosling.js, Ideogram.js and ECharts remain candidates for a separate linked/local workspace and require the spikes and supply-chain gates below.\n",
          )
          replace_once(
              technology,
              "Current `report.py` reads `PipelineResult` directly and assembles HTML strings. A view model would:\n",
              "The original direct-rendering gap has been reduced: `report.py` now consumes a typed `ReportView` for core reviewer fields, while optional module artifacts feed bounded deterministic plot helpers. Further view-model coverage would:\n",
          )
          PY
          rm -f .github/workflows/refresh-pr25-docs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: reconcile visualization design with current implementation'
          git push origin HEAD:${{ github.ref_name }}
