name: Repair QDNAseq parser numeric invariants

on:
  push:
    branches:
      - fix/qdnaseq-parser-numeric-invariants

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Add regressions, harden parser, verify and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          from pathlib import Path

          test = Path("tests/test_qdnaseq_coordinates.py")
          text = test.read_text(encoding="utf-8")
          anchor = '''    @unittest.skipUnless(\n        shutil.which("Rscript"), "Rscript is required for actual R exporter regression"\n    )\n'''
          addition = '''    def test_fractional_integer_fields_fail_closed(self) -> None:\n        with tempfile.TemporaryDirectory() as raw:\n            path = Path(raw) / "segments.tsv"\n            path.write_text(\n                "chromosome\\tstart\\tend\\tbin_count\\tabsolute_copy_number\\tcall\\tcoordinate_system\\n"\n                "chr7\\t0\\t500\\t1.5\\t1\\t-1\\tzero_based_half_open\\n"\n            )\n            with self.assertRaisesRegex(ValueError, "invalid integer value for bin_count"):\n                _events_from_primary_segments(\n                    path,\n                    sample_id="SYNTH",\n                    fit=_fit(),\n                    tools=[],\n                    reference_lock=_lock(),\n                    minimum_segment_bins=1,\n                    whole_chromosome_fraction=0.9,\n                    consensus={},\n                )\n\n    def test_non_finite_numeric_fields_fail_closed(self) -> None:\n        with tempfile.TemporaryDirectory() as raw:\n            path = Path(raw) / "segments.tsv"\n            for field, absolute_copy_number, call in (\n                ("absolute_copy_number", "inf", "-1"),\n                ("call", "1", "-inf"),\n            ):\n                with self.subTest(field=field):\n                    path.write_text(\n                        "chromosome\\tstart\\tend\\tbin_count\\tabsolute_copy_number\\tcall\\tcoordinate_system\\n"\n                        f"chr7\\t0\\t500\\t1\\t{absolute_copy_number}\\t{call}\\tzero_based_half_open\\n"\n                    )\n                    with self.assertRaisesRegex(ValueError, "non-finite numeric value"):\n                        _events_from_primary_segments(\n                            path,\n                            sample_id="SYNTH",\n                            fit=_fit(),\n                            tools=[],\n                            reference_lock=_lock(),\n                            minimum_segment_bins=1,\n                            whole_chromosome_fraction=0.9,\n                            consensus={},\n                        )\n\n''' + anchor
          if text.count(anchor) != 1:
              raise SystemExit("QDNAseq coordinate test anchor changed unexpectedly")
          test.write_text(text.replace(anchor, addition, 1), encoding="utf-8")
          PY

          python -m pip install --disable-pip-version-check -q -e . pytest
          set +e
          pytest -q tests/test_qdnaseq_coordinates.py \
            -k 'fractional_integer_fields_fail_closed or non_finite_numeric_fields_fail_closed'
          red_status=$?
          set -e
          if [ "$red_status" -eq 0 ]; then
            echo "New QDNAseq parser regressions unexpectedly passed before the fix" >&2
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          src = Path("src/ontseq_platform/cnv/qdnaseq.py")
          text = src.read_text(encoding="utf-8")
          if "import math\n" not in text:
              text = text.replace("import json\n", "import json\nimport math\n", 1)

          old = '''def _float(row: Mapping[str, str], key: str) -> float:\n    value = row.get(key, "")\n    try:\n        parsed = float(value)\n    except (TypeError, ValueError) as exc:\n        raise ValueError(f"invalid numeric value for {key}: {value!r}") from exc\n    if parsed != parsed:\n        raise ValueError(f"invalid NaN value for {key}")\n    return parsed\n\n\ndef _int(row: Mapping[str, str], key: str) -> int:\n    value = row.get(key, "")\n    try:\n        return int(float(value))\n    except (TypeError, ValueError) as exc:\n        raise ValueError(f"invalid integer value for {key}: {value!r}") from exc\n'''
          new = '''def _float(row: Mapping[str, str], key: str) -> float:\n    value = row.get(key, "")\n    try:\n        parsed = float(value)\n    except (TypeError, ValueError) as exc:\n        raise ValueError(f"invalid numeric value for {key}: {value!r}") from exc\n    if not math.isfinite(parsed):\n        raise ValueError(f"non-finite numeric value for {key}: {value!r}")\n    return parsed\n\n\ndef _int(row: Mapping[str, str], key: str) -> int:\n    value = row.get(key, "")\n    try:\n        parsed = float(value)\n    except (TypeError, ValueError) as exc:\n        raise ValueError(f"invalid integer value for {key}: {value!r}") from exc\n    if not math.isfinite(parsed) or not parsed.is_integer():\n        raise ValueError(f"invalid integer value for {key}: {value!r}")\n    return int(parsed)\n'''
          if text.count(old) != 1:
              raise SystemExit("QDNAseq TSV numeric helper anchor changed unexpectedly")
          text = text.replace(old, new, 1)

          old = '''def _as_float(value: object, key: str) -> float:\n    if not isinstance(value, int | float | str):\n        raise ValueError(f"invalid numeric value for {key}: {value!r}")\n    try:\n        parsed = float(value)\n    except ValueError as exc:\n        raise ValueError(f"invalid numeric value for {key}: {value!r}") from exc\n    if parsed != parsed:\n        raise ValueError(f"invalid NaN value for {key}")\n    return parsed\n'''
          new = '''def _as_float(value: object, key: str) -> float:\n    if not isinstance(value, int | float | str):\n        raise ValueError(f"invalid numeric value for {key}: {value!r}")\n    try:\n        parsed = float(value)\n    except ValueError as exc:\n        raise ValueError(f"invalid numeric value for {key}: {value!r}") from exc\n    if not math.isfinite(parsed):\n        raise ValueError(f"non-finite numeric value for {key}: {value!r}")\n    return parsed\n'''
          if text.count(old) != 1:
              raise SystemExit("QDNAseq JSON numeric helper anchor changed unexpectedly")
          src.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          python -m pip install --disable-pip-version-check -q ruff mypy types-PyYAML types-openpyxl
          ruff format src/ontseq_platform/cnv/qdnaseq.py tests/test_qdnaseq_coordinates.py
          ruff check .
          ruff format --check .
          mypy src
          pytest -q tests/test_qdnaseq_coordinates.py tests/test_qdnaseq_runtime.py

          rm -f .github/workflows/qdnaseq-parser-repair.yml
          git add -A
          git diff --cached --check
          git commit -m "fix: reject malformed QDNAseq numeric output"
          git push origin HEAD:fix/qdnaseq-parser-numeric-invariants
