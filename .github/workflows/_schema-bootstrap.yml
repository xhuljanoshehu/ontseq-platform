# TEMPORARY bootstrap workflow.
#
# The session authoring this branch has no outbound access to PyPI, so it cannot install
# pydantic or ruff and therefore cannot produce the generated JSON Schemas or apply
# canonical formatting locally. This workflow does both in CI and emits the results as
# compact encoded blobs so they can be reconstructed and committed.
#
# Deleted again before this pull request is finished; if you are reading this on main, it
# should not be here.
name: Schema bootstrap (temporary)

on:
  workflow_dispatch:
  push:
    branches: [claude/ontseq-cnv-pipeline-7pad7m]

permissions:
  contents: read

jobs:
  emit-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Regenerate schemas
        run: python scripts/export_schemas.py
      - name: Apply canonical formatting
        run: ruff format .
      - name: Report residual lint findings
        continue-on-error: true
        run: ruff check . 2>&1 | tail -40
      - name: Report type findings
        continue-on-error: true
        run: mypy src 2>&1 | tail -40
      - name: Run the unit tests
        continue-on-error: true
        run: python -m unittest discover -s tests 2>&1 | tail -60
      - name: Emit schemas as an encoded blob
        run: |
          echo "-----SCHEMA-BLOB-BEGIN-----"
          tar -czf - schemas | base64 -w 120
          echo "-----SCHEMA-BLOB-END-----"
      - name: Emit the formatting diff as an encoded blob
        run: |
          git diff -- src tests scripts > /tmp/format.diff || true
          wc -c /tmp/format.diff
          echo "-----FORMAT-BLOB-BEGIN-----"
          gzip -c /tmp/format.diff | base64 -w 120
          echo "-----FORMAT-BLOB-END-----"
