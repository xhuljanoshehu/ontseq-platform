name: Format debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "ruff>=0.6"
      - name: Show formatter diff
        run: ruff format --diff src/ontseq_platform/cnv/cytoband_regions.py tests/test_cnv_cytoband_regions.py
