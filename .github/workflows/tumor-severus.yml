name: Tumor Severus real-tool

on:
  pull_request:
    paths:
      - "src/ontseq_platform/sv/severus.py"
      - "workflow/envs/severus_1_7.yaml"
      - "tests/test_severus_runtime.py"
      - "tests/test_severus_real_tool.py"
      - ".github/workflows/tumor-severus.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  severus-paired-real-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: workflow/envs/severus_1_7.yaml
          cache-environment: true
          post-cleanup: all

      - name: Verify pinned Severus runtime
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          test -n "$(command -v severus)"
          severus --version | grep -Eq '(^|[^0-9])1\.7([^0-9]|$)'
          severus --help >/tmp/severus-help.txt
          grep -Fq -- '--target-bam' /tmp/severus-help.txt
          grep -Fq -- '--control-bam' /tmp/severus-help.txt
          grep -Fq -- '--out-dir' /tmp/severus-help.txt

      - name: Run Severus adapter contract and synthetic real-tool smoke
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          ONTSEQ_SEVERUS_REAL_TOOL=1 PYTHONPATH=src             python -m pytest -q tests/test_severus_runtime.py tests/test_severus_real_tool.py
