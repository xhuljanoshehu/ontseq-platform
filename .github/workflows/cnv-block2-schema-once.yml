name: CNV block 2 schema once

on:
  push:
    branches:
      - feat/cnv-validation-program
    paths:
      - ".github/workflows/cnv-block2-schema-once.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/cnv-validation-program
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install ONTSeq
        run: python -m pip install -e .
      - name: Generate versioned schemas
        run: python scripts/export_schemas.py
      - name: Commit Block 2 schemas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            schemas/cnv-validation-evidence.schema.json \
            schemas/cnv-validation-traceability.schema.json
          if git diff --cached --quiet; then
            echo "Block 2 schemas already current."
          else
            git commit -m "schema(cnv): freeze block 2 evidence contracts"
            git push origin HEAD:feat/cnv-validation-program
          fi
