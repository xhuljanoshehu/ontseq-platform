name: Repair quantitation model invariants

on:
  push:
    branches:
      - fix/quantitation-model-invariants

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Add failing regressions, implement fail-closed model guards, verify
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          from pathlib import Path

          test = Path("tests/test_quantitation.py")
          text = test.read_text(encoding="utf-8")

          anchor = '''    def test_rejects_an_impossible_tumour_fraction(self) -> None:\n        with self.assertRaises(QuantitationError):\n            cancer_cell_fraction(\n                AlleleObservation(10, 80), tumour_fraction=0.0, copy_number_state=NEUTRAL\n            )\n'''
          addition = anchor + '''\n    def test_zero_variant_reads_is_not_a_determinate_zero_ccf(self) -> None:\n        result = cancer_cell_fraction(\n            AlleleObservation(0, 80), tumour_fraction=0.5, copy_number_state=NEUTRAL\n        )\n        self.assertFalse(result.determinable)\n        self.assertEqual(result.status, NO_VARIANT_READS)\n        self.assertIsNone(result.point)\n        self.assertIsNone(result.subclonal_at(0.9))\n\n    def test_refuses_a_vaf_that_implies_ccf_above_one(self) -> None:\n        result = cancer_cell_fraction(\n            AlleleObservation(30, 80), tumour_fraction=0.5, copy_number_state=NEUTRAL\n        )\n        self.assertFalse(result.determinable)\n        self.assertEqual(result.status, VAF_EXCEEDS_HETEROZYGOUS_MODEL)\n        self.assertIsNone(result.point)\n'''
          if text.count(anchor) != 1:
              raise SystemExit("CancerCellFractionTests anchor changed unexpectedly")
          text = text.replace(anchor, addition, 1)

          anchor = '''    def test_rejects_a_negative_ratio(self) -> None:\n        with self.assertRaises(QuantitationError):\n            copy_number_from_ratio(ratio=-0.1, tumour_fraction=0.5)\n'''
          addition = anchor + '''\n    def test_refuses_a_ratio_below_the_zero_copy_mixture_floor(self) -> None:\n        # With 50% tumour, even a homozygous tumour deletion leaves one normal-cell copy\n        # per mixed cell: the observed ratio cannot fall below 0.5 under this model.\n        with self.assertRaises(QuantitationError):\n            copy_number_from_ratio(ratio=0.49, tumour_fraction=0.5)\n'''
          if text.count(anchor) != 1:
              raise SystemExit("CopyNumberTests anchor changed unexpectedly")
          test.write_text(text.replace(anchor, addition, 1), encoding="utf-8")
          PY

          python -m pip install --disable-pip-version-check -q -e . pytest
          set +e
          pytest -q tests/test_quantitation.py \
            -k 'zero_variant_reads_is_not_a_determinate_zero_ccf or refuses_a_vaf_that_implies_ccf_above_one or refuses_a_ratio_below_the_zero_copy_mixture_floor'
          red_status=$?
          set -e
          if [ "$red_status" -eq 0 ]; then
            echo "New regressions unexpectedly passed before the fix" >&2
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          src = Path("src/ontseq_platform/quantitation.py")
          text = src.read_text(encoding="utf-8")

          old = '''    if copy_number_state != COPY_NEUTRAL_DIPLOID:\n        return CancerCellFraction(status=NOT_COPY_NEUTRAL, point=None, interval=None)\n    if observation.total_reads < min_depth:\n        return CancerCellFraction(status=DEPTH_TOO_LOW, point=None, interval=None)\n\n    band = wilson_interval(observation, confidence=confidence)\n    scale = 2.0 / tumour_fraction\n    return CancerCellFraction(\n        status=DETERMINABLE,\n        point=min(1.0, observation.vaf * scale),\n        interval=Interval(low=min(1.0, band.low * scale), high=min(1.0, band.high * scale)),\n    )\n'''
          new = '''    if copy_number_state != COPY_NEUTRAL_DIPLOID:\n        return CancerCellFraction(status=NOT_COPY_NEUTRAL, point=None, interval=None)\n    if observation.total_reads < min_depth:\n        return CancerCellFraction(status=DEPTH_TOO_LOW, point=None, interval=None)\n    if observation.variant_reads == 0:\n        # Zero observed variant reads provides an upper bound, not evidence that a known\n        # variant occupies exactly zero tumour cells. Keep \"not observed\" distinct from\n        # a determinate biological fraction.\n        return CancerCellFraction(status=NO_VARIANT_READS, point=None, interval=None)\n\n    scale = 2.0 / tumour_fraction\n    implied = observation.vaf * scale\n    if implied > 1.0:\n        # Clipping this to one would hide that the supplied tumour fraction, copy-neutral\n        # heterozygous model and observed VAF cannot all be true simultaneously.\n        return CancerCellFraction(\n            status=VAF_EXCEEDS_HETEROZYGOUS_MODEL, point=None, interval=None\n        )\n\n    band = wilson_interval(observation, confidence=confidence)\n    return CancerCellFraction(\n        status=DETERMINABLE,\n        point=implied,\n        interval=Interval(low=min(1.0, band.low * scale), high=min(1.0, band.high * scale)),\n    )\n'''
          if text.count(old) != 1:
              raise SystemExit("cancer_cell_fraction implementation anchor changed unexpectedly")
          text = text.replace(old, new, 1)

          old = '''    if ratio < 0.0:\n        raise QuantitationError(f"ratio cannot be negative, got {ratio}")\n    return (2.0 * ratio - 2.0 * (1.0 - tumour_fraction)) / tumour_fraction\n'''
          new = '''    if ratio < 0.0:\n        raise QuantitationError(f"ratio cannot be negative, got {ratio}")\n    minimum_ratio = 1.0 - tumour_fraction\n    if ratio < minimum_ratio:\n        raise QuantitationError(\n            f"ratio {ratio} is below the physical mixture floor {minimum_ratio} for "\n            f"tumour_fraction={tumour_fraction}; the diploid-normal mixture model would "\n            "require a negative tumour copy number"\n        )\n    return (2.0 * ratio - 2.0 * (1.0 - tumour_fraction)) / tumour_fraction\n'''
          if text.count(old) != 1:
              raise SystemExit("copy_number_from_ratio implementation anchor changed unexpectedly")
          src.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          rm -f .github/workflows/quantitation-repair.yml
          git add -A
          git diff --cached --check

          python -m pip install --disable-pip-version-check -q ruff mypy types-PyYAML types-openpyxl
          ruff check src tests
          mypy src
          pytest -q tests/test_quantitation.py

          git commit -m "fix: fail closed on impossible quantitative model states"
          git push origin HEAD:fix/quantitation-model-invariants
