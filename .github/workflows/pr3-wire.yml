name: One-shot desktop stage durations

on:
  push:
    branches:
      - feat/desktop-stage-durations

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Patch, verify, commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:RUNNER_TEMP 'pr3-wire.log'
          @'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              data = p.read_bytes()
              nl = '\r\n' if b'\r\n' in data else '\n'
              for old_s, new_s in replacements:
                  old = old_s.replace('\n', nl).encode('utf-8')
                  new = new_s.replace('\n', nl).encode('utf-8')
                  if data.count(old) != 1:
                      raise SystemExit(f'{path}: expected 1 match, found {data.count(old)}')
                  data = data.replace(old, new, 1)
              p.write_bytes(data)
              print(f'patched {path}')

          patch('desktop/ONTSeq.Desktop/Models.cs', [
              (
                  '''public sealed record StageDisplay(string Title, string Status, string Reason)
          {
              // Timeline colors mirror the portable report's status semantics: NO_CALL stays
              // neutral amber, NOT_RUN neutral gray; only FAILED is red, and a stage that has
              // not reported yet stays hollow.
          ''',
                  '''public sealed record StageDisplay(string Title, string Status, string Reason,
              double? DurationSeconds = null)
          {
              // Timeline colors mirror the portable report's status semantics: NO_CALL stays
              // neutral amber, NOT_RUN neutral gray; only FAILED is red, and a stage that has
              // not reported yet stays hollow.
          ''',
              ),
              (
                  '''    public string NodeToolTip => string.IsNullOrWhiteSpace(Reason)
                  ? $"{Title} · {StatusCaption}"
                  : $"{Title} · {StatusCaption}: {Reason}";
          ''',
                  '''    // Persisted stage duration, rendered compactly in German locale. An absent
              // or negative duration stays empty rather than displaying a placeholder value.
              public string DurationText => DurationSeconds is not double seconds || seconds < 0
                  ? ""
                  : seconds < 60
                      ? $"{seconds:0.0} s"
                      : $"{(int)seconds / 60} min {(int)seconds % 60:00} s";

              public string NodeToolTip => string.IsNullOrWhiteSpace(Reason)
                  ? $"{Title} · {StatusCaption}{DurationSuffix}"
                  : $"{Title} · {StatusCaption}{DurationSuffix}: {Reason}";

              private string DurationSuffix =>
                  DurationText.Length == 0 ? "" : $" · {DurationText}";
          ''',
              ),
          ])

          patch('desktop/ONTSeq.Desktop/MainWindow.xaml.cs', [
              (
                  '''            StageItems.Add(new StageDisplay(stage.Title, stage.Status, stage.Reason));
          ''',
                  '''            StageItems.Add(new StageDisplay(
                  stage.Title, stage.Status, stage.Reason, stage.DurationSeconds));
          ''',
              ),
          ])

          patch('desktop/ONTSeq.Desktop/MainWindow.xaml', [
              (
                  '''                                    <Grid.ColumnDefinitions>
                                                      <ColumnDefinition Width="32" />
                                                      <ColumnDefinition Width="230" />
                                                      <ColumnDefinition Width="120" />
                                                      <ColumnDefinition Width="*" />
                                                  </Grid.ColumnDefinitions>
          ''',
                  '''                                    <Grid.ColumnDefinitions>
                                                      <ColumnDefinition Width="32" />
                                                      <ColumnDefinition Width="230" />
                                                      <ColumnDefinition Width="120" />
                                                      <ColumnDefinition Width="80" />
                                                      <ColumnDefinition Width="*" />
                                                  </Grid.ColumnDefinitions>
          ''',
              ),
              (
                  '''                                    <TextBlock Grid.Column="2" Text="{Binding Status}" Foreground="#4F6073" />
                                                  <TextBlock Grid.Column="3" Text="{Binding Reason}" Foreground="#758294" TextTrimming="CharacterEllipsis" ToolTip="{Binding Reason}" />
          ''',
                  '''                                    <TextBlock Grid.Column="2" Text="{Binding Status}" Foreground="#4F6073" />
                                                  <TextBlock Grid.Column="3" Text="{Binding DurationText}" Foreground="#4F6073" ToolTip="{Binding NodeToolTip}" />
                                                  <TextBlock Grid.Column="4" Text="{Binding Reason}" Foreground="#758294" TextTrimming="CharacterEllipsis" ToolTip="{Binding Reason}" />
          ''',
              ),
          ])

          patch('desktop/ONTSeq.Desktop/CHANGELOG.md', [
              (
                  '''## Unreleased

          ''',
                  '''## Unreleased

          - Show each stage's measured duration (persisted `duration_seconds` provenance) next
            to its status in the run list and in the timeline tooltips; absent durations stay
            empty instead of showing a placeholder. Presentation only; no backend, contract
            or provenance change.
          ''',
              ),
          ])
          '@ | python - *>&1 | Tee-Object -FilePath $log
          $patchExit = $LASTEXITCODE
          $buildExit = 999
          $testExit = 999
          if ($patchExit -eq 0) {
            & dotnet build desktop/ONTSeq.Desktop/ONTSeq.Desktop.csproj -c Release *>&1 |
              Tee-Object -FilePath $log -Append
            $buildExit = $LASTEXITCODE
          }
          if ($buildExit -eq 0) {
            & dotnet run --project desktop/ONTSeq.Desktop.Tests/ONTSeq.Desktop.Tests.csproj -c Release *>&1 |
              Tee-Object -FilePath $log -Append
            $testExit = $LASTEXITCODE
          }
          if ($patchExit -eq 0 -and $buildExit -eq 0 -and $testExit -eq 0) {
            Remove-Item '.github/workflows/pr3-wire.yml'
            Remove-Item '.github/pr3-diagnostic.txt' -ErrorAction SilentlyContinue
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git diff --cached --check
            git commit -m 'feat(desktop): show measured stage durations'
            git push origin HEAD:${{ github.ref_name }}
          }
          else {
            git checkout -- .
            Remove-Item '.github/workflows/pr3-wire.yml' -ErrorAction SilentlyContinue
            @("patch_exit=$patchExit", "build_exit=$buildExit", "test_exit=$testExit", '--- log tail ---') |
              Set-Content -Encoding utf8 '.github/pr3-diagnostic.txt'
            Get-Content $log -Tail 200 | Add-Content -Encoding utf8 '.github/pr3-diagnostic.txt'
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'ci: update desktop duration wiring diagnostic'
            git push origin HEAD:${{ github.ref_name }}
          }
          exit 0
