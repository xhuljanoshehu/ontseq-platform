name: CNV ruff fix

on:
  push:
    branches:
      - feat/cnv-validation-program
    paths:
      - ".github/workflows/cnv-ruff-fix.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.6"
      - name: Apply Ruff fixes and formatting
        run: |
          ruff check --fix \
            scripts/export_schemas.py \
            src/ontseq_platform/cnv_validation_contracts.py \
            src/ontseq_platform/cnv_validation_registration.py \
            tests/test_cnv_validation_contracts.py \
            tests/test_cnv_validation_registration.py
          ruff format \
            scripts/export_schemas.py \
            src/ontseq_platform/cnv_validation_contracts.py \
            src/ontseq_platform/cnv_validation_registration.py \
            tests/test_cnv_validation_contracts.py \
            tests/test_cnv_validation_registration.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/export_schemas.py \
            src/ontseq_platform/cnv_validation_contracts.py \
            src/ontseq_platform/cnv_validation_registration.py \
            tests/test_cnv_validation_contracts.py \
            tests/test_cnv_validation_registration.py
          if git diff --cached --quiet; then
            echo "Already Ruff-clean."
          else
            git commit -m "style(cnv): apply final ruff formatting"
            git push origin HEAD:feat/cnv-validation-program
          fi
