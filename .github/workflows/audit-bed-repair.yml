name: Verify modkit BED repair
on:
  push:
    branches: [fix/audit-20260909]
    paths: [.github/workflows/audit-bed-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'xhuljanoshehu/ontseq-platform' && github.ref == 'refs/heads/fix/audit-20260909'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply exact reviewed source patch
        run: |
          git merge-base --is-ancestor 03ecba50b360a84df7d1a02c56f8f72c41f8359f HEAD
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          encoded = ''
          patch = gzip.decompress(base64.b64decode(encoded))
          assert len(patch) == 9643
          assert hashlib.sha256(patch).hexdigest() == 'dbef0583502ab000eafba6cca36f259138ff614007f5cb397bccc6009cc1ca82'
          Path('/tmp/bed-repair.patch').write_bytes(patch)
          PY
          git apply --check --index /tmp/bed-repair.patch
          git apply --index /tmp/bed-repair.patch
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: workflow/envs/aligned_bam.yaml
          cache-environment: true
      - name: Prove correction using the real pinned binary
        shell: micromamba-shell {0}
        run: |
          ONTSEQ_MODKIT_REAL_TOOL=1 PYTHONPATH=src python -m unittest discover -s tests -p 'test_modkit_real_tool.py' -v
      - name: Check Python regression suite
        run: |
          python -m pip install -e '.[dev,workflow]' pysam
          mkdir -p /tmp/bed-repair-checks
          python scripts/check_repository_safety.py
          python scripts/export_schemas.py --check
          python scripts/check_version_consistency.py
          ruff check .
          ruff format --check .
          mypy src
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest --tb=short --junitxml=/tmp/bed-repair-checks/pytest.xml
      - name: Commit verified correction on repair branch only
        run: |
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve labelled target regions through pinned modkit BED parser'
          git push origin HEAD:refs/heads/fix/audit-20260909
          git rev-parse HEAD > /tmp/bed-repair-checks/commit.txt
          git bundle create /tmp/bed-repair-checks/repaired-source.bundle HEAD
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verified-bed-repair-${{ github.sha }}
          path: /tmp/bed-repair-checks/
          retention-days: 7
          if-no-files-found: warn
