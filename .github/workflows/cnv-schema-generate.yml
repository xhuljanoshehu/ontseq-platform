name: CNV schema generate

on:
  push:
    branches:
      - feat/cnv-validation-program
    paths:
      - "src/ontseq_platform/cnv_validation_*.py"
      - "scripts/export_schemas.py"
      - ".github/workflows/cnv-schema-generate.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Generate schemas
        run: python scripts/export_schemas.py
      - name: Upload CNV schemas
        uses: actions/upload-artifact@v7
        with:
          name: cnv-validation-schemas
          path: |
            schemas/cnv-validation-matrix.schema.json
            schemas/cnv-validation-cohort.schema.json
            schemas/cnv-validation-registration.schema.json
          if-no-files-found: error
          retention-days: 1
