repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: repository-safety
        name: Block genomic data and oversized files
        entry: python scripts/check_repository_safety.py
        language: system
        pass_filenames: false
