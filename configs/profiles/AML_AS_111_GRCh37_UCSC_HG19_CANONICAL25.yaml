description: >-
  Research-only native GRCh37 Adaptive Sampling profile for the exact UCSC hg19
  Canonical-25 BAM dictionary (chr1-22, chrX, chrY and chrM=16571 in that order).
  The shared 111-target intent has 110/111 forward-mapped nuclear intervals and 109/111
  reciprocal-exact intervals; ACACA requires roundtrip review and CT45A2 remains split/unmapped.
  Native GENCODE 19 resolves 108/111 analysis ROIs; mapped IGH_REVIEW_REQUIRED and
  GPR128_REVIEW_REQUIRED intervals remain legacy selection-only, without native gene IDs or
  gene-coverage claims. Reference-dependent callers receive the exact Canonical-25 FASTA built
  from native GENCODE 19 chr1-22/X/Y and UCSC's original NC_001807 chrM. Annotation remains
  nuclear/native; no reheadering, mapping, sequence substitution or fallback occurs at runtime.
