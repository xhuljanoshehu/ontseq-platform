description: >-
  GRCh37 low-coverage whole-genome research analysis for the exact UCSC hg19
  Canonical-25 BAM dictionary: chr1-22, chrX, chrY and chrM=16571 in that order,
  without decoys, ALT loci or additional sequences. The exact analysis FASTA combines
  pinned native GENCODE 19 GRCh37.p13 chr1-22/X/Y with the original UCSC hg19
  NC_001807 chrM. The BAM is never reheadered and coordinates are never implicitly
  lifted. Annotation remains native GENCODE 19; this is not clinical validation.
