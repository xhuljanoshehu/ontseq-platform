description: >-
  Research-only GRCh37.p13 Adaptive Sampling profile. Its selection BED is a controlled,
  checksum-pinned build-time mapping of the exact normalized 111-target laboratory intent:
  110/111 intervals mapped forward and 109/111 are reciprocal-exact; ACACA requires roundtrip
  review and CT45A2 remains split/unmapped. Native GENCODE 19 resolves 108/111 analysis ROIs;
  mapped IGH_REVIEW_REQUIRED and GPR128_REVIEW_REQUIRED intervals remain legacy selection-only,
  without native gene IDs or gene-coverage claims. No mapping, build inference or cross-build
  fallback occurs at runtime.
