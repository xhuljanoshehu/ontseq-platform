schema_version: 0.1.0
suite_id: hematologic_fusion_software_v1
status: synthetic_software_benchmark_only
description: >-
  Deliberately non-biological software benchmark semantics for the ONTSeq DNA fusion layer.
  Family labels are mnemonic test names only. This file contains no real genomic coordinates,
  no clinical reportability rules and no analytical validation thresholds.
fixtures:
