    family_label: BCR::ABL1 synthetic topology
    expected_classification: gene_gene
    partner_expectation: exact_pair
    expected_gene_pair: [BCR, ABL1]
    expected_primary_observability: observable
    expected_secondary_observability: observable
    expected_candidate_count: 1
    note: Exact gene-pair software behavior only; no biological breakpoint or transcript claim.

