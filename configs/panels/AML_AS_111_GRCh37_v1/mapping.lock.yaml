note: >-
  RESEARCH USE ONLY. Controlled build-time mapping of the exact checksum-pinned
  111-interval GRCh38 selection with liftOver -minMatch=0.99 (default
  minBlocks=1.00, no -multiple). CT45A2 split in the target assembly and is
  omitted without a partial interval or native replacement. All 110 mapped
  intervals remain on the same chromosome; 102 preserve their span exactly.
  The chain and liftOver executable are provenance only and are not distributed
  or used at runtime. A checksum-pinned reverse mapping with the official
  hg19ToHg38 chain returned 109 intervals exactly to their GRCh38 source
  coordinates; ACACA split on reverse mapping and remains explicitly
  ROUNDTRIP_REVIEW_REQUIRED. IGH_REVIEW_REQUIRED and GPR128_REVIEW_REQUIRED retain
  forward-mapped legacy selection-only intervals without native GENCODE19 gene IDs
  or analysis ROIs; they are not claims of IGH/GPR128 gene coverage.
