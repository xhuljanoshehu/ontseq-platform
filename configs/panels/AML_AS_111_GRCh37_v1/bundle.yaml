description: RESEARCH USE ONLY, analytically unvalidated. GRCh37/hg19 Adaptive Sampling
  bundle preserving the 111-target GRCh38 design intent through a controlled, checksum-pinned
  build-time UCSC liftOver. Exactly 110 intervals mapped; CT45A2 split and is omitted
  without partial or substitute coordinates. Native GENCODE19 gene-ID curation resolves
  108 targets. Reverse mapping is reciprocal-exact for 109/110 mapped intervals; ACACA
  remains explicitly roundtrip-review-required. No coordinate mapping, fallback or
  chain access occurs at activation or analysis runtime. The mapped IGH_REVIEW_REQUIRED
  and GPR128_REVIEW_REQUIRED intervals are legacy selection-only source labels without
  native gene IDs or ROIs and must not be interpreted as gene coverage.
