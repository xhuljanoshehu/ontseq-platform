schema_version: 0.1.0
selection_id: legacy-sniffles-2.4-comparison-v1
status: technical_defaults_only
note: >-
  Reproduces the structural-variant component of the historical Hannover ONTseq pipeline,
  whose released VCFs were written by Sniffles 2.4. Its only purpose is comparison: run a
  sample under this selection and under ontseq-default-v1, then compare the two envelopes.
  Neither result is the reference for the other.
components:
  align:
    provider: minimap2
    version: "2.28"
    policy: configs/alignment/minimap2.ont.technical.yaml
  intake:
    provider: samtools
    version: "1.24"
  qc:
    provider: cramino
    version: "1.3.0"
  target_coverage:
    provider: mosdepth
    version: 0.3.14
    policy: configs/qc/adaptive_target_coverage.technical.yaml
  sv:
    provider: sniffles2
    version: 2.4.0
    policy: configs/sv/sniffles2.legacy_2_4.technical.yaml
  cnv:
    provider: qdnaseq_ace
    enabled: false
    note: Deselected so a comparison run isolates the structural-variant difference.
