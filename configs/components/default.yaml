schema_version: 0.1.0
selection_id: ontseq-default-v1
status: technical_defaults_only
note: >-
  The components this repository exercises in CI. Versions are pinned to the toolchain in
  workflow/envs/aligned_bam.yaml; a run whose installed tools differ fails the affected
  stage instead of quietly producing results from a different program.
components:
  align:
    provider: minimap2
    version: "2.28"
    policy: configs/alignment/minimap2.ont.technical.yaml
  intake:
    provider: samtools
    version: "1.24"
  qc:
    provider: cramino
    version: "1.3.0"
  target_coverage:
    provider: mosdepth
    version: 0.3.14
    policy: configs/qc/adaptive_target_coverage.technical.yaml
  sv:
    provider: sniffles2
    version: 2.8.0
    policy: configs/sv/sniffles2.conservative.technical.yaml
  cnv:
    provider: qdnaseq_ace
    policy: configs/cnv/qdnaseq_ace.technical.yaml
    note: >-
      QDNAseq and ACE are R packages rather than a single executable, so the version is
      recorded from the R probe in the stage's provenance instead of pinned here.
