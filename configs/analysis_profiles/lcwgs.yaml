profile_version: 0.1.0
status: proposed_unvalidated
assay_mode: lcwgs
reference_builds: [GRCh37, GRCh38]
modules:
  qc:
    provider: cramino
  cnv:
    selection_status: benchmark_required
    candidates:
      - provider: ichorcna
        evidence_scope: transferable_low_coverage
      - provider: qdnaseq_ace
        bin_sizes_kb: [100, 500, 1000]
        ace_penalty_candidates: [0.4, 0.6, 0.8]
        retain_alternative_fits: true
      - provider: spectre
        evidence_scope: ont_workflow_reference
    reportability: benchmark_only
    chromosome_consensus: nearest
  sv:
    enabled: false
    reason: requires_assay_specific_coverage_validation
  fusion:
    enabled: false
  iscn:
    mode: proposal_only
  report:
    formats: [json, html, xlsx]
limitations:
  - No CNV provider or ACE penalty is selected until the intended-use benchmark passes.
  - Published low-coverage CNV evidence is not necessarily ONT- or AML-specific.
  - Subchromosomal CNV reportability requires separate validation by bin size and event class.
