profile_version: 0.1.0
status: proposed_unvalidated
assay_mode: adaptive_sampling
reference_builds: [GRCh37, GRCh38]
requires:
  - target_bed
  - target_bed_version
modules:
  qc:
    provider: cramino
    additional_metrics:
      - on_target_coverage
      - off_target_coverage
      - per_target_coverage
      - both_fusion_partner_coverage
  cnv:
    provider: qdnaseq_ace
    global_reportability: false
    reason: adaptive_sampling_coverage_bias_requires_validation
  sv:
    region_scope: buffered_target_bed
    selection_status: benchmark_required
    candidates: [sniffles2, cutesv, savana, severus]
    consensus_policy: retain_all_with_evidence_tier
  fusion:
    source: normalized_sv_breakends
    annotation: snpeff
    require_bidirectional_evidence: true
  iscn:
    mode: proposal_only
  report:
    formats: [json, html, xlsx]
limitations:
  - Candidate callers have different germline, tumor-only and tumor-normal assumptions.
  - Breakpoints outside the locked target design can be unobservable and require a no-call state.
  - Tumor or blast fraction and per-partner coverage are mandatory reportability inputs.
  - Caller agreement must not be treated as proof of biological truth.
