schema_version: 1.0.0
bundle_type: reference
bundle_id: GRCh37_GENCODE19_HG19_v2
version: v2
genome_build: GRCh37
description: >-
  Immutable GRCh37 reference family with the native GENCODE19 GRCh37.p13 full assembly
  and an additional exact UCSC hg19 Canonical-25 analysis FASTA. The Canonical-25 FASTA
  copies chr1-22/X/Y from the pinned native full assembly and uses the publisher-pinned
  original UCSC hg19 chrM (NC_001807, 16571 bases). No runtime liftover, reheadering,
  sequence substitution or cross-build fallback is permitted.
reference_lock_resource_id: reference_lock
fasta_resource_id: genome_fasta
fai_resource_id: fasta_index
annotation_cache_resource_id: annotation_cache
