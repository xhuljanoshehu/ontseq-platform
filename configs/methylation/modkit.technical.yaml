schema_version: 0.2.0
profile_id: modkit-cpg-technical-v1
status: technical_defaults_only
expected_version: 0.6.4
modification_codes:
  - m
  - h
cpg_only: true
combine_strands: true
filter_threshold: 0.8
minimum_valid_coverage: 5
region_source: chromosome
verify_modified_base_tags: true
note: >-
  Technical descriptive defaults only. The 0.8 confidence threshold and the 5x valid-coverage
  floor are engineering starting points, not validated analytical or clinical cut-offs, and no
  reported fraction may be read as a methylation classification. The threshold is pinned rather
  than estimated from the sample so that two runs of this pipeline run the same pipeline.
  modkit 0.6.x removed --ignore; the pileup declares the reported modifications explicitly via
  --modified-bases 5mC 5hmC, which requires the locked reference FASTA. 5mC and 5hmC are
  reported as separate rows sharing the valid-call denominator (N_valid = N_mod + N_canonical +
  N_other_mod); no probability is folded from one class into another, and a model that emits
  only 5mC simply produces no 5hmC rows. Historically, --ignore h redistributed p_h/2 to
  canonical C and p_h/2 to 5mC at the probability-transformation stage; its effect on final
  hard-call counts and fractions depended on competing probabilities and thresholds. The
  expected modkit version is an engineering pin: re-pin it deliberately against the installed
  binary and record the change, because pileup output is not comparable across modkit majors.
  The adapter is exercised against the real pinned binary in CI on synthetic MM/ML fixtures;
  that is tool interoperability, not analytical recovery or clinical validation.
