notes:
  - The 0.8 confidence threshold is the published MARLIN high-confidence threshold; ONTSeq does not retune it against GSE280090.
  - The runtime fixture generator and numerical tolerances above are fixed engineering contracts declared before external biological validation; they must not be tuned from AL_001 or GSE280090 outcomes.
  - The dual-runtime compatibility gate compares one frozen reference runtime with one live candidate runtime against the same immutable classifier artifact set and non-biological fixture.
  - The runtime fixture is explicitly non-biological and contains only deterministic -1, 0 and +1 feature values.
  - A frozen runtime profile or dual-runtime PASS proves numerical compatibility only for the locked model/runtime/fixture contract; it does not establish analytical or clinical validity.
