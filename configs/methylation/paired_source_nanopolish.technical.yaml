note: >-
  Technical paired-source defaults only. The reported value is calibrated to the fraction of
  held-out read groups drawn from source A and must not be interpreted as tumour purity, blast
  fraction, cell fraction or DNA-mass fraction. Thresholds and no-call gates are engineering
  starting points without analytical or clinical validation. Calibration and mixture pools are
  disjoint within each input but still come from the same two biological sources; seeded
  replicates are not independent specimens. total_mixture_read_groups is derived here so the
  profile can execute on differently sized inputs; pin it before comparing separate experiments.
  The point estimate fits methylated and unmethylated call rates per total read group. Its
  conditional Dirichlet interval holds calibration rates fixed and varies the fitted mixture's
  methylated, unmethylated, ambiguous and missing states; it therefore omits calibration-source
  uncertainty and biological variation. The LLR threshold is
  applied per motif (threshold times num_motifs), and the fit-RMSE gate is variance-standardized,
  dimensionless and unvalidated. All reports are sensitive derived genomic outputs. Provide the
  exact reference FASTA checksum and declared caller, platform, flow-cell, library-kit and
  basecaller provenance through the source metadata sidecars; unavailable fields remain unknown
  and trigger reviewer warnings. Preserve complete commands and additional protocol context in
  the controlled run record. The parser enforces policy byte/row safety caps but retains accepted
  canonical calls in RAM, so a SMALL public-data smoke is only a technical integration check and
  establishes neither purity/LoD nor production-scale memory suitability. Series-level recovery
  PASS/FAIL/NOT_EVALUABLE uses engineering-only bias, MAE, RMSE, interval-coverage and
  quantifiable-grid thresholds; it is not an analytical or clinical validation verdict.
