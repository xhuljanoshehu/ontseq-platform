note: >-
  Technical descriptive adaptive-sampling profile. Aggregate the locked analysis target BED
  with the same explicit --modified-bases 5mC 5hmC definition as modkit-cpg-technical-v1:
  separate rows per modification code, shared valid-call denominator, no folding. Failed and
  no-call counts remain outside that denominator and are retained separately. The 0.8 confidence
  threshold and 5x coverage floor are engineering defaults without analytical or clinical
  validation. Off-target regions are outside this target summary. No tumor purity, cell fraction
  or classification is inferred. The adapter is exercised against the real pinned modkit 0.6.4
  binary in CI on synthetic fixtures; that is tool interoperability, not analytical or clinical
  validation.
